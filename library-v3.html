<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1877f2"><title>Game Library</title><style>html,body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111;min-height:100%;}body{padding-bottom:90px}header{background:#1877f2;color:#fff;padding:18px;position:relative;z-index:10}main{max-width:1000px;margin:auto;padding:16px;position:relative;z-index:10}.box{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}.buttons{display:flex;gap:10px;flex-wrap:wrap}.go{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:#1877f2;color:#fff;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;pointer-events:auto;position:relative;z-index:100000}.gray{background:#e5e7eb;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.game{background:#fff;border-radius:14px;padding:14px}.muted{color:#6b7280;font-size:13px}input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;font-size:16px}.nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;height:72px!important;z-index:2147483647!important;background:#111827!important;display:grid!important;grid-template-columns:repeat(6,1fr)!important;pointer-events:auto!important}.nav a{display:flex!important;align-items:center!important;justify-content:center!important;flex-direction:column!important;color:#fff!important;text-decoration:none!important;font-size:11px!important;font-weight:700!important;cursor:pointer!important;pointer-events:auto!important;position:relative!important;z-index:2147483647!important;border:0!important;background:transparent!important}.nav a:active{background:#374151!important}#status{margin-top:12px;color:#6b7280;font-size:13px}</style></head><body><header><h1>📚 Beau's Game Library</h1><p>Library navigation test build 5.0</p></header><main><section class="box"><div class="buttons"><a class="go" href="./index.html#dashboard">← Back to App</a><a class="go" href="./scanner-v3.html?v=3.2.0">📷 Scan New Game</a><a class="go gray" href="./library-v3.html?v=5.0">↻ Refresh</a></div><div id="status">Navigation uses direct browser links — no app JavaScript.</div></section><section class="box"><input id="search" placeholder="🔎 Search saved games"><div id="grid" class="grid" style="margin-top:14px"></div></section></main><nav class="nav"><a href="./index.html#dashboard">📊<br>Dashboard</a><a href="./index.html#inventory">📦<br>Inventory</a><a href="./scanner-v3.html?v=3.2.0">📷<br>Scanner</a><a href="./index.html#pricing">💰<br>Pricing</a><a href="./library-v3.html?v=5.0">📚<br>Library</a><a href="./index.html#settings">⚙️<br>Settings</a></nav><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(){let a=[];try{a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){}if(!Array.isArray(a))a=[];let q=document.getElementById('search').value.toLowerCase();a=a.filter(g=>[g.title,g.barcode,g.platform].join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=a.length?a.map(g=>'<article class="game"><h3>🎮 '+esc(g.title||'Game')+'</h3><div class="muted">'+esc(g.platform||'Unknown platform')+'</div><p>Barcode: '+esc(g.barcode||'')+'</p></article>').join(''):'<div style="grid-column:1/-1;text-align:center;padding:40px">📚 No saved games yet</div>'}document.getElementById('search').addEventListener('input',render);render();</script></body></html>

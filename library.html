<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1877f2"><title>Beau's Game Library</title><link rel="stylesheet" href="./mobile-theme.css?v=2.1.0"><link rel="stylesheet" href="./nav-icons.css?v=2.2.0"><style>:root{--nav-h:72px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px)!important}header{background:#1877f2;color:#fff;padding:18px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}header h1{margin:0;font-size:24px}header p{margin:7px 0 0}main{max-width:900px;margin:auto;padding:16px}.toolbar,.stats{background:#fff;padding:14px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px}.toolbar input,.toolbar select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.toolbar-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border-radius:12px;background:#f3f4f6;text-align:center}.stat span{display:block;font-size:10px;color:#6b7280;font-weight:800}.stat strong{display:block;font-size:18px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 9px rgba(0,0,0,.09);overflow:hidden;cursor:pointer}.game img{width:100%;height:180px;object-fit:contain;border-radius:12px;background:#f3f4f6}.game h2{font-size:17px;margin:11px 0 5px}.meta{font-size:12px;color:#6b7280}.prices{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.price{padding:9px;border-radius:10px;background:#f3f4f6;text-align:center}.price span{display:block;font-size:10px;color:#6b7280;font-weight:700}.price strong{display:block;font-size:16px;margin-top:3px}.buy{color:#1877f2}.used{color:#15803d}.badge{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}.market{background:#dcfce7;color:#166534}.estimate{background:#fef3c7;color:#92400e}.deal-good{background:#dcfce7;color:#166534}.deal-fair{background:#fef3c7;color:#92400e}.deal-pass{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:50px 20px;color:#6b7280;background:#fff;border-radius:18px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.mobile-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))!important;z-index:9999!important;background:#111827!important;border-top:1px solid #374151!important;padding:5px 4px env(safe-area-inset-bottom,0px)!important}.details-modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding:14px}.details-card{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:22px}.details-card img{display:block;width:170px;height:170px;object-fit:contain;margin:0 auto 16px;border-radius:16px;background:#f3f4f6}.details-card h2{text-align:center;margin:0 0 5px}.details-card .sub{text-align:center;color:#6b7280;margin:0 0 18px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-box{padding:13px;border-radius:13px;background:#f3f4f6;text-align:center}.detail-box span{display:block;font-size:10px;color:#6b7280;font-weight:800}.detail-box strong{display:block;font-size:21px;margin-top:5px}.detail-source{margin-top:12px;padding:13px;border-radius:13px;background:#f8fafc;font-size:13px;line-height:1.5;color:#4b5563}.detail-actions{display:flex;gap:9px;margin-top:16px}.detail-actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700}.close-x{float:right;border:0;background:none;font-size:28px;line-height:1;cursor:pointer}@media(max-width:520px){main{padding:10px}.grid{grid-template-columns:1fr}.game img{height:210px}.stats{grid-template-columns:1fr 1fr}.details-card{padding:18px}.details-card img{width:145px;height:145px}}body.dark-mode{background:#111827;color:#f3f4f6}body.dark-mode .toolbar,body.dark-mode .game,body.dark-mode .empty,body.dark-mode .details-card,body.dark-mode .stats{background:#1f2937;color:#f3f4f6}body.dark-mode .game img,body.dark-mode .price,body.dark-mode .detail-box,body.dark-mode .detail-source,body.dark-mode .stat{background:#111827}body.dark-mode .toolbar input,body.dark-mode .toolbar select{background:#111827;color:#fff;border-color:#4b5563}</style></head><body><header><h1>📚 Beau's Game Library</h1><p>Every scanned game, deal and pricing estimate in one place.</p></header><main><div class="toolbar"><input id="search" placeholder="🔎 Search games, barcodes or platforms..."><div class="toolbar-row"><select id="sort"><option value="recent">Recently scanned</option><option value="profit">Highest potential profit</option><option value="margin">Highest margin</option><option value="buy">Lowest estimated buy</option><option value="value">Highest second-hand value</option></select><button class="primary" id="scan">📷 Scan New Game</button></div><div class="actions"><button class="secondary" id="clear">🗑️ Clear Library</button></div></div><div id="stats" class="stats"></div><div id="count" class="meta" style="margin:10px 4px"></div><div id="grid" class="grid"></div></main><div id="modal"></div><nav class="mobile-nav" aria-label="App navigation"><button data-go="index.html#dashboard"><span class="icon"></span><span class="label">Dashboard</span></button><button data-go="index.html#inventory"><span class="icon"></span><span class="label">Inventory</span></button><button data-go="scanner.html"><span class="icon"></span><span class="label">Scanner</span></button><button data-go="index.html#pricing"><span class="icon"></span><span class="label">Pricing</span></button><button class="active"><span class="icon"></span><span class="label">Library</span></button><button data-go="index.html#settings"><span class="icon"></span><span class="label">Settings</span></button></nav><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';let games=[];try{games=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){games=[]}if(!Array.isArray(games))games=[];function deal(g){const p=Number(g.purchasePrice),v=Number(g.resale);if(!p||!v)return null;const profit=v-p,margin=v?profit/v*100:0;return{profit,margin,label:profit<=0||margin<20?'PASS':margin<40?'FAIR':'GOOD'}}function stats(){const priced=games.filter(g=>Number(g.resale)>0),profit=priced.reduce((s,g)=>{const d=deal(g);return s+(d?.profit>0?d.profit:0)},0),value=priced.reduce((s,g)=>s+Number(g.resale||0),0),good=games.filter(g=>deal(g)?.label==='GOOD').length;document.getElementById('stats').innerHTML=`<div class="stat"><span>GAMES</span><strong>${games.length}</strong></div><div class="stat"><span>EST. VALUE</span><strong>${money(value)}</strong></div><div class="stat"><span>POTENTIAL PROFIT</span><strong>${money(profit)}</strong></div><div class="stat"><span>GOOD DEALS</span><strong>${good}</strong></div><div class="stat"><span>WITH PURCHASE PRICE</span><strong>${games.filter(g=>Number(g.purchasePrice)>0).length}</strong></div><div class="stat"><span>MARKET DATA</span><strong>${games.filter(g=>!g.secondEstimated).length}</strong></div>`}function render(){const q=document.getElementById('search').value.trim().toLowerCase();let a=games.filter(g=>[g.title,g.barcode,g.platform].join(' ').toLowerCase().includes(q));const s=document.getElementById('sort').value;a.sort((x,y)=>{if(s==='profit')return (deal(y)?.profit||-Infinity)-(deal(x)?.profit||-Infinity);if(s==='margin')return (deal(y)?.margin||-Infinity)-(deal(x)?.margin||-Infinity);if(s==='buy')return Number(x.buy||Infinity)-Number(y.buy||Infinity);if(s==='value')return Number(y.resale||0)-Number(x.resale||0);return new Date(y.checkedAt||0)-new Date(x.checkedAt||0)});document.getElementById('count').textContent=`${a.length} saved game${a.length===1?'':'s'}`;document.getElementById('grid').innerHTML=a.length?a.map((g,i)=>{const estimated=!!g.secondEstimated,d=deal(g),secondLabel=estimated?'EST. SECOND-HAND':'SECOND-HAND MARKET',badge=estimated?'<span class="badge estimate">ESTIMATED</span>':'<span class="badge market">MARKET DATA</span>',dealBadge=d?`<span class="badge ${d.label==='GOOD'?'deal-good':d.label==='FAIR'?'deal-fair':'deal-pass'}">${d.label} BUY</span>`:'';return `<article class="game" data-open="${i}">${g.image?`<img src="${esc(g.image)}" alt="${esc(g.title)} thumbnail">`:'<div style="height:180px;border-radius:12px;background:#f3f4f6;display:grid;place-items:center;font-size:50px">🎮</div>'}<h2>${esc(g.title)}</h2><div class="meta">${esc(g.platform||'Game')} • ${esc(g.barcode||'')}</div><div class="prices"><div class="price"><span>EST. BUY</span><strong class="buy">${money(g.buy)}</strong></div><div class="price"><span>${secondLabel}</span><strong class="used">${money(g.resale)}</strong>${badge}</div></div>${d?`<div class="meta" style="margin-top:8px">Purchase: ${money(g.purchasePrice)} • Profit: ${money(d.profit)}</div>`:dealBadge?`<div style="margin-top:7px">${dealBadge}</div>`:''}<div class="actions"><button class="secondary" data-remove="${esc(g.barcode)}">Remove</button></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1"><div style="font-size:52px">📚</div><h2>Your library is empty</h2><p>Scan a game and its pricing will automatically be saved here.</p></div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-remove]'))return;openDetails(a[Number(b.dataset.open)])});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();games=games.filter(g=>String(g.barcode)!==String(b.dataset.remove));localStorage.setItem('beauGameLibrary',JSON.stringify(games));stats();render()});stats()}function openDetails(g){if(!g)return;const estimated=!!g.secondEstimated,sources=g.sourceNames?.length?g.sourceNames.join(', '):'Pricing data returned by the online service',checked=g.checkedAt?new Date(g.checkedAt).toLocaleString():'Not recorded',d=deal(g);document.getElementById('modal').innerHTML=`<div class="details-modal" id="detailsModal"><div class="details-card"><button class="close-x" id="closeDetails">×</button>${g.image?`<img src="${esc(g.image)}" alt="${esc(g.title)} thumbnail">`:'<div style="height:60px"></div>'}<h2>${esc(g.title)}</h2><p class="sub">${esc(g.platform||'Game')} • Barcode ${esc(g.barcode||'')}</p><div class="detail-grid"><div class="detail-box"><span>ESTIMATED BUY</span><strong class="buy">${money(g.buy)}</strong></div><div class="detail-box"><span>BRAND NEW</span><strong>${money(g.retail)}</strong></div><div class="detail-box"><span>${estimated?'EST. SECOND-HAND':'SECOND-HAND MARKET'}</span><strong class="used">${money(g.resale)}</strong></div><div class="detail-box"><span>CONFIDENCE</span><strong>${esc(g.confidence||'Low')}</strong></div></div><div class="detail-source"><strong>${estimated?'Estimated value':'Market value returned'}</strong><br>${estimated?'No reliable second-hand market value was returned, so the value is estimated from available new-price data.':'A second-hand market value was returned by the pricing service.'}<br><br><strong>Purchase price:</strong> ${money(g.purchasePrice)}${d?`<br><strong>Potential profit:</strong> ${money(d.profit)}<br><strong>Margin:</strong> ${d.margin.toFixed(1)}%<br><strong>Verdict:</strong> ${d.label}`:''}<br><br><strong>Sources:</strong> ${esc(sources)}<br><strong>Last checked:</strong> ${esc(checked)}</div><div class="detail-actions"><button class="secondary" id="closeDetails2">Close</button><button class="primary" id="scanAnother">Scan Another</button></div></div></div>`;const close=()=>document.getElementById('modal').innerHTML='';document.getElementById('closeDetails').onclick=close;document.getElementById('closeDetails2').onclick=close;document.getElementById('scanAnother').onclick=()=>location.href='./scanner.html';document.getElementById('detailsModal').onclick=e=>{if(e.target.id==='detailsModal')close()}}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;document.getElementById('scan').onclick=()=>location.href='./scanner.html';document.getElementById('clear').onclick=()=>{if(confirm('Clear every saved scanned game?')){games=[];localStorage.removeItem('beauGameLibrary');stats();render()}};document.querySelectorAll('.mobile-nav button[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);if(localStorage.getItem('beauDarkMode')==='1'||localStorage.getItem('resellerDarkMode')==='1')document.body.classList.add('dark-mode');render();</script></body></html>

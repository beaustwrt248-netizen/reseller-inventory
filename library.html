<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1877f2"><title>Beau's Game Library</title><link rel="stylesheet" href="./mobile-theme.css?v=2.1.0"><link rel="stylesheet" href="./nav-icons.css?v=2.2.0"><style>*{box-sizing:border-box}body{margin:0;padding:0 0 90px;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}header{background:#1877f2;color:#fff;padding:18px 16px}main{max-width:900px;margin:auto;padding:16px}.box{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.toolbar input,.toolbar select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.btn{border:0;border-radius:11px;padding:12px;font-weight:700}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f3f4f6;border-radius:12px;padding:10px;text-align:center}.stat span{display:block;font-size:10px;color:#6b7280;font-weight:800}.stat strong{display:block;font-size:18px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 9px #0001;cursor:pointer}.game img{width:100%;height:180px;object-fit:contain;border-radius:12px;background:#f3f4f6}.game h2{font-size:17px;margin:10px 0 5px}.meta{font-size:12px;color:#6b7280}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.price{padding:9px;border-radius:10px;background:#f3f4f6;text-align:center}.price span{display:block;font-size:10px;color:#6b7280;font-weight:700}.price strong{display:block;font-size:16px;margin-top:3px}.buy{color:#1877f2}.used{color:#15803d}.badge{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}.market,.good{background:#dcfce7;color:#166534}.estimate,.fair{background:#fef3c7;color:#92400e}.pass{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:#000b;z-index:10000;display:flex;align-items:flex-end;padding:14px}.card{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;margin:auto}.card img{display:block;width:160px;height:160px;object-fit:contain;margin:auto;border-radius:16px;background:#f3f4f6}.card h2{text-align:center}.sub{text-align:center;color:#6b7280}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{padding:12px;border-radius:12px;background:#f3f4f6;text-align:center}.detail span{display:block;font-size:10px;font-weight:800;color:#6b7280}.detail strong{display:block;font-size:20px;margin-top:4px}.editor{margin-top:12px;padding:13px;border-radius:13px;background:#eff6ff}.editor input{width:100%;padding:12px;border:2px solid #cbd5e1;border-radius:11px;font-size:17px;margin-top:6px}.live{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.live div{background:#fff;padding:9px;border-radius:10px;text-align:center}.live span{display:block;font-size:10px;color:#64748b;font-weight:800}.source{margin-top:12px;padding:13px;border-radius:13px;background:#f8fafc;font-size:13px;line-height:1.5}.nav{position:fixed!important;bottom:0!important;left:0!important;right:0!important;z-index:9999!important;width:100%!important;height:72px!important;background:#111827!important}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.game img{height:210px}.card{padding:17px}}body.dark-mode{background:#111827;color:#f3f4f6}body.dark-mode .box,body.dark-mode .game,body.dark-mode .card{background:#1f2937;color:#f3f4f6}body.dark-mode .stat,body.dark-mode .price,body.dark-mode .detail,body.dark-mode .source,body.dark-mode .editor{background:#111827}body.dark-mode input,body.dark-mode select{background:#111827;color:#fff;border-color:#4b5563}</style></head><body><header><h1>📚 Beau's Game Library</h1><p>Every scanned game, deal and pricing estimate in one place.</p></header><main><section class="box toolbar"><input id="search" placeholder="🔎 Search games, barcodes or platforms"><div class="row"><select id="sort"><option value="recent">Recently scanned</option><option value="profit">Highest profit</option><option value="margin">Highest margin</option><option value="buy">Lowest buy price</option><option value="value">Highest value</option></select><button class="btn primary" id="scan">📷 Scan New Game</button></div><div class="actions"><button class="btn secondary" id="clear">🗑️ Clear Library</button></div></section><section id="stats" class="box stats"></section><div id="count" class="meta"></div><section id="grid" class="grid"></section></main><div id="modal"></div><nav class="nav mobile-nav"><button data-go="index.html#dashboard"><span class="icon"></span><span class="label">Dashboard</span></button><button data-go="index.html#inventory"><span class="icon"></span><span class="label">Inventory</span></button><button data-go="scanner.html"><span class="icon"></span><span class="label">Scanner</span></button><button data-go="index.html#pricing"><span class="icon"></span><span class="label">Pricing</span></button><button class="active"><span class="icon"></span><span class="label">Library</span></button><button data-go="index.html#settings"><span class="icon"></span><span class="label">Settings</span></button></nav><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';let games=[];try{games=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){}if(!Array.isArray(games))games=[];const save=()=>localStorage.setItem('beauGameLibrary',JSON.stringify(games));function deal(g){let p=Number(g.purchasePrice),v=Number(g.resale);if(!(p>0&&v>0))return null;let profit=v-p,margin=profit/v*100;return{profit,margin,label:profit<=0||margin<20?'PASS':margin<40?'FAIR':'GOOD'}}function stats(){let value=games.reduce((n,g)=>n+Number(g.resale||0),0),profit=games.reduce((n,g)=>{let d=deal(g);return n+(d?.profit>0?d.profit:0)},0);document.getElementById('stats').innerHTML=`<div class="stat"><span>GAMES</span><strong>${games.length}</strong></div><div class="stat"><span>EST. VALUE</span><strong>${money(value)}</strong></div><div class="stat"><span>POTENTIAL PROFIT</span><strong>${money(profit)}</strong></div><div class="stat"><span>GOOD DEALS</span><strong>${games.filter(g=>deal(g)?.label==='GOOD').length}</strong></div><div class="stat"><span>PURCHASE PRICES</span><strong>${games.filter(g=>Number(g.purchasePrice)>0).length}</strong></div><div class="stat"><span>MARKET DATA</span><strong>${games.filter(g=>!g.secondEstimated).length}</strong></div>`}function render(){let q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('sort').value,a=games.filter(g=>[g.title,g.barcode,g.platform].join(' ').toLowerCase().includes(q));a.sort((x,y)=>s==='profit'?(deal(y)?.profit||-1e9)-(deal(x)?.profit||-1e9):s==='margin'?(deal(y)?.margin||-1e9)-(deal(x)?.margin||-1e9):s==='buy'?Number(x.buy||1e9)-Number(y.buy||1e9):s==='value'?Number(y.resale||0)-Number(x.resale||0):new Date(y.checkedAt||0)-new Date(x.checkedAt||0);document.getElementById('count').textContent=`${a.length} saved game${a.length===1?'':'s'}`;document.getElementById('grid').innerHTML=a.length?a.map((g,i)=>{let d=deal(g),est=!!g.secondEstimated;return `<article class="game" data-i="${i}">${g.image?`<img src="${esc(g.image)}" alt="${esc(g.title)}">`:'<div style="height:180px;display:grid;place-items:center;font-size:50px">🎮</div>'}<h2>${esc(g.title)}</h2><div class="meta">${esc(g.platform||'Game')} • ${esc(g.barcode||'')}</div><div class="prices"><div class="price"><span>EST. BUY</span><strong class="buy">${money(g.buy)}</strong></div><div class="price"><span>${est?'EST. SECOND-HAND':'SECOND-HAND MARKET'}</span><strong class="used">${money(g.resale)}</strong><span class="badge ${est?'estimate':'market'}">${est?'ESTIMATED':'MARKET DATA'}</span></div></div>${d?`<div class="meta" style="margin-top:8px">Purchase ${money(g.purchasePrice)} • Profit ${money(d.profit)} <span class="badge ${d.label==='GOOD'?'good':d.label==='FAIR'?'fair':'pass'}">${d.label} BUY</span></div>`:''}</article>`}).join(''):'<div class="box" style="grid-column:1/-1;text-align:center;padding:50px"><div style="font-size:52px">📚</div><h2>Your library is empty</h2><p>Scan a game to save it here.</p></div>';document.querySelectorAll('.game').forEach((el)=>el.onclick=()=>open(a[Number(el.dataset.i)]));stats()}function open(g){let d=deal(g),est=!!g.secondEstimated,sources=g.sourceNames?.length?g.sourceNames.join(', '):'Online pricing service';document.getElementById('modal').innerHTML=`<div class="modal" id="m"><div class="card"><button id="x" style="float:right;border:0;background:none;font-size:28px">×</button>${g.image?`<img src="${esc(g.image)}">`:'<div style="height:50px"></div>'}<h2>${esc(g.title)}</h2><p class="sub">${esc(g.platform||'Game')} • ${esc(g.barcode||'')}</p><div class="detailgrid"><div class="detail"><span>EST. BUY</span><strong class="buy">${money(g.buy)}</strong></div><div class="detail"><span>BRAND NEW</span><strong>${money(g.retail)}</strong></div><div class="detail"><span>${est?'EST. SECOND-HAND':'SECOND-HAND MARKET'}</span><strong class="used">${money(g.resale)}</strong></div><div class="detail"><span>CONFIDENCE</span><strong>${esc(g.confidence||'Low')}</strong></div></div><div class="editor"><label><strong>Actual purchase price</strong></label><input id="purchase" type="number" min="0" step="0.01" value="${Number(g.purchasePrice)>0?esc(g.purchasePrice):''}" placeholder="e.g. 18.00"><div class="live"><div><span>POTENTIAL PROFIT</span><strong id="lp">${d?money(d.profit):'—'}</strong></div><div><span>MARGIN</span><strong id="lm">${d?d.margin.toFixed(1)+'%':'—'}</strong></div></div></div><div class="source"><strong>${est?'Estimated value':'Market value returned'}</strong><br>${est?'No reliable used-market value was returned; the second-hand value is an estimate.':'A second-hand market value was returned.'}<br><br><strong>Sources:</strong> ${esc(sources)}<br><strong>Last checked:</strong> ${esc(g.checkedAt?new Date(g.checkedAt).toLocaleString():'Not recorded')}</div><div class="actions"><button class="btn secondary" id="close">Close</button><button class="btn primary" id="saveDeal">💾 Save Deal</button></div></div></div>`;const close=()=>document.getElementById('modal').innerHTML='';document.getElementById('x').onclick=close;document.getElementById('close').onclick=close;let inp=document.getElementById('purchase');inp.oninput=()=>{let z=deal({...g,purchasePrice:Number(inp.value)});document.getElementById('lp').textContent=z?money(z.profit):'—';document.getElementById('lm').textContent=z?z.margin.toFixed(1)+'%':'—'};document.getElementById('saveDeal').onclick=()=>{g.purchasePrice=Number(inp.value)||0;g.dealSavedAt=new Date().toISOString();save();close();render()};document.getElementById('m').onclick=e=>{if(e.target.id==='m')close()}}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;document.getElementById('scan').onclick=()=>location.href='./scanner.html';document.getElementById('clear').onclick=()=>{if(confirm('Clear every saved scanned game?')){games=[];save();render()}};document.querySelectorAll('.mobile-nav button[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);if(localStorage.getItem('beauDarkMode')==='1'||localStorage.getItem('resellerDarkMode')==='1')document.body.classList.add('dark-mode');render();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1877f2"><title>Beau's Game Library</title><link rel="stylesheet" href="./mobile-theme.css?v=2.0.0"><link rel="stylesheet" href="./nav-icons.css?v=2.0.0"><style>
:root{--nav-h:72px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px)!important}header{background:#1877f2;color:#fff;padding:18px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}header h1{margin:0;font-size:24px}header p{margin:7px 0 0}main{max-width:800px;margin:auto;padding:16px}.toolbar{background:#fff;padding:14px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px}.toolbar input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 9px rgba(0,0,0,.09);overflow:hidden}.game img{width:100%;height:180px;object-fit:contain;border-radius:12px;background:#f3f4f6}.game h2{font-size:17px;margin:11px 0 5px}.meta{font-size:12px;color:#6b7280}.prices{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.price{padding:9px;border-radius:10px;background:#f3f4f6;text-align:center}.price span{display:block;font-size:10px;color:#6b7280;font-weight:700}.price strong{display:block;font-size:16px;margin-top:3px}.buy{color:#1877f2}.used{color:#15803d}.empty{text-align:center;padding:50px 20px;color:#6b7280;background:#fff;border-radius:18px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.mobile-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))!important;z-index:9999!important;background:#111827!important;border-top:1px solid #374151!important;padding:5px 4px env(safe-area-inset-bottom,0px)!important}body.dark-mode{background:#111827;color:#f3f4f6}body.dark-mode .toolbar,body.dark-mode .game,body.dark-mode .empty{background:#1f2937;color:#f3f4f6}body.dark-mode .game img,body.dark-mode .price{background:#111827}body.dark-mode .toolbar input{background:#111827;color:#fff;border-color:#4b5563}@media(max-width:520px){main{padding:10px}.grid{grid-template-columns:1fr}.game img{height:210px}}
</style></head><body><header><h1>📚 Beau's Game Library</h1><p>Every game you've scanned, with its latest pricing estimate.</p></header><main><div class="toolbar"><input id="search" placeholder="🔎 Search your scanned games..."><div class="actions"><button class="primary" id="scan">📷 Scan New Game</button><button class="secondary" id="clear">🗑️ Clear Library</button></div></div><div id="count" class="meta" style="margin:10px 4px"></div><div id="grid" class="grid"></div></main><nav class="mobile-nav" aria-label="App navigation"><button data-go="index.html#dashboard"><span class="icon"></span><span class="label">Dashboard</span></button><button data-go="index.html#inventory"><span class="icon"></span><span class="label">Inventory</span></button><button data-go="scanner.html"><span class="icon"></span><span class="label">Scanner</span></button><button data-go="index.html#pricing"><span class="icon"></span><span class="label">Pricing</span></button><button class="active"><span class="icon"></span><span class="label">Library</span></button><button data-go="index.html#settings"><span class="icon"></span><span class="label">Settings</span></button></nav><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';let games=[];try{games=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){games=[]}if(!Array.isArray(games))games=[];function render(){const q=document.getElementById('search').value.trim().toLowerCase();const a=games.filter(g=>[g.title,g.barcode,g.platform].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`${a.length} saved game${a.length===1?'':'s'}`;document.getElementById('grid').innerHTML=a.length?a.map(g=>`<article class="game">${g.image?`<img src="${esc(g.image)}" alt="${esc(g.title)} thumbnail">`:'<div style="height:180px;border-radius:12px;background:#f3f4f6;display:grid;place-items:center;font-size:50px">🎮</div>'}<h2>${esc(g.title)}</h2><div class="meta">${esc(g.platform||'Game')} • ${esc(g.barcode||'')}</div><div class="prices"><div class="price"><span>EST. BUY</span><strong class="buy">${money(g.buy)}</strong></div><div class="price"><span>EST. SECOND-HAND</span><strong class="used">${money(g.resale)}</strong></div></div><div class="actions"><button class="secondary" data-remove="${esc(g.barcode)}">Remove</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><div style="font-size:52px">📚</div><h2>Your library is empty</h2><p>Scan a game and its pricing will automatically be saved here.</p></div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{games=games.filter(g=>String(g.barcode)!==String(b.dataset.remove));localStorage.setItem('beauGameLibrary',JSON.stringify(games));render()})}document.getElementById('search').oninput=render;document.getElementById('scan').onclick=()=>location.href='./scanner.html';document.getElementById('clear').onclick=()=>{if(confirm('Clear every saved scanned game?')){games=[];localStorage.removeItem('beauGameLibrary');render()}};document.querySelectorAll('.mobile-nav button[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);if(localStorage.getItem('beauDarkMode')==='1'||localStorage.getItem('resellerDarkMode')==='1')document.body.classList.add('dark-mode');render();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1877f2"><title>Beau's Game Library</title><link rel="stylesheet" href="./mobile-theme.css?v=3.5.0"><link rel="stylesheet" href="./nav-icons.css?v=3.5.0"><style>*{box-sizing:border-box}body{margin:0;padding:0 0 90px;font-family:Arial,sans-serif;background:#f0f2f5;color:#1c1e21}header{background:#1877f2;color:#fff;padding:18px}main{max-width:1000px;margin:auto;padding:15px}.box,.game{background:#fff;border:1px solid #dddfe2;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 1px 3px #0002}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px}.toolbar input,.toolbar select{padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#1877f2;color:#fff}.secondary{background:#e4e6eb;color:#111}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;background:#f3f4f6;border-radius:10px;padding:12px}.stat span{display:block;font-size:11px;color:#65676b;font-weight:700}.stat strong{font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.game{margin:0;cursor:pointer}.game h2{font-size:17px;margin:8px 0}.meta{font-size:12px;color:#65676b}.prices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.price{background:#f3f4f6;padding:9px;border-radius:9px;text-align:center}.price span{display:block;font-size:10px;color:#65676b}.price strong{font-size:16px}.modal{position:fixed;inset:0;background:#000b;z-index:9999;display:grid;place-items:center;padding:15px}.modal-card{background:#fff;border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.close{float:right;font-size:26px;border:0;background:none;cursor:pointer}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#111827;display:grid;grid-template-columns:repeat(6,1fr);z-index:10000}.nav button{border:0;background:transparent;color:#fff;font-weight:700;font-size:11px}.nav button.active{background:#1877f2}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}.nav button{font-size:9px}}</style></head><body><header><h1>📚 Beau's Game Library</h1><p>Saved games, pricing and deal information.</p></header><main><section class="box toolbar"><input id="search" placeholder="🔎 Search games, barcodes or platforms"><select id="sort"><option value="recent">Recently scanned</option><option value="profit">Highest profit</option><option value="value">Highest value</option></select><button class="btn primary" id="scan">📷 Scan New Game</button></section><section id="stats" class="box stats"></section><p id="count" class="meta"></p><section id="grid" class="grid"></section></main><div id="modal"></div><nav class="nav"><button data-go="index.html#dashboard">📊<br>Dashboard</button><button data-go="index.html#inventory">📦<br>Inventory</button><button data-go="scanner-v3.html?v=3.5.0">📷<br>Scanner</button><button data-go="index.html#pricing">💰<br>Pricing</button><button class="active">📚<br>Library</button><button data-go="index.html#settings">⚙️<br>Settings</button></nav><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';let games=[];try{games=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){}if(!Array.isArray(games))games=[];function deal(g){const p=Number(g.purchasePrice),v=Number(g.resale);return p>0&&v>0?{profit:v-p,margin:(v-p)/v*100}:null}function render(){const q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('sort').value,a=games.filter(g=>[g.title,g.barcode,g.platform].join(' ').toLowerCase().includes(q)).sort((x,y)=>s==='profit'?(deal(y)?.profit||-1e9)-(deal(x)?.profit||-1e9):s==='value'?Number(y.resale||0)-Number(x.resale||0):new Date(y.checkedAt||0)-new Date(x.checkedAt||0));document.getElementById('count').textContent=a.length+' saved game'+(a.length===1?'':'s');document.getElementById('grid').innerHTML=a.length?a.map((g,i)=>`<article class="game" data-i="${i}">${g.image?`<img src="${esc(g.image)}" style="width:100%;height:170px;object-fit:contain">`:'<div style="height:170px;display:grid;place-items:center;font-size:55px">🎮</div>'}<h2>${esc(g.title||'Game')}</h2><div class="meta">${esc(g.platform||'Other')} • ${esc(g.barcode||'')}</div><div class="prices"><div class="price"><span>BUY</span><strong>${money(g.buy)}</strong></div><div class="price"><span>SECOND-HAND</span><strong>${money(g.resale)}</strong></div></div></article>`).join(''):'<div class="box" style="grid-column:1/-1;text-align:center;padding:50px"><div style="font-size:50px">📚</div><h2>Your library is empty</h2><p>Scan a game to save it here.</p></div>';document.querySelectorAll('.game').forEach(e=>e.onclick=()=>open(a[Number(e.dataset.i)]));const value=games.reduce((n,g)=>n+Number(g.resale||0),0),profit=games.reduce((n,g)=>n+Math.max(0,deal(g)?.profit||0),0);document.getElementById('stats').innerHTML=`<div class="stat"><span>GAMES</span><strong>${games.length}</strong></div><div class="stat"><span>EST. VALUE</span><strong>${money(value)}</strong></div><div class="stat"><span>POTENTIAL PROFIT</span><strong>${money(profit)}</strong></div>`}function open(g){const d=deal(g);document.getElementById('modal').innerHTML=`<div class="modal" id="m"><div class="modal-card"><button class="close" id="x">×</button><h2>${esc(g.title||'Game')}</h2><p>${esc(g.platform||'Other')} • ${esc(g.barcode||'')}</p><div class="prices"><div class="price"><span>RRP</span><strong>${money(g.retail)}</strong></div><div class="price"><span>SECOND-HAND</span><strong>${money(g.resale)}</strong></div><div class="price"><span>MAX BUY</span><strong>${money(g.buy)}</strong></div><div class="price"><span>PROFIT</span><strong>${d?money(d.profit):'Not set'}</strong></div></div><p>Last checked: ${esc(g.checkedAt?new Date(g.checkedAt).toLocaleString():'Not recorded')}</p><button class="btn secondary" id="close">Close</button></div></div>`;const close=()=>document.getElementById('modal').innerHTML='';document.getElementById('x').onclick=close;document.getElementById('close').onclick=close;document.getElementById('m').onclick=e=>{if(e.target.id==='m')close()}}document.getElementById('search').oninput=render;document.getElementById('sort').onchange=render;document.getElementById('scan').onclick=()=>location.href='./scanner-v3.html?v=3.5.0';document.querySelectorAll('.nav button[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);if(localStorage.getItem('beauDarkMode')==='1'||localStorage.getItem('resellerDarkMode')==='1')document.body.classList.add('dark-mode');render();</script></body></html>

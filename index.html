<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Inventory</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0 0 5px;
}

header p {
    margin: 0;
    opacity: .8;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: #6b7280;
}

.card strong {
    font-size: 21px;
}

.panel {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.panel h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #dc2626;
    color: white;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.scanner-box {
    display: none;
    margin-top: 15px;
    border: 2px solid #2563eb;
    border-radius: 12px;
    padding: 10px;
}

#reader {
    width: 100%;
}

.item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.item-name {
    font-size: 19px;
    font-weight: bold;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    background: #e5e7eb;
    border-radius: 20px;
    font-size: 12px;
    margin: 5px 4px 0 0;
}

.price-box {
    margin-top: 15px;
    padding: 15px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
}

.price-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    gap: 10px;
}

.highlight {
    font-size: 20px;
    font-weight: bold;
}

.barcode {
    font-family: monospace;
    font-size: 14px;
    color: #374151;
}

.good {
    color: #16a34a;
    font-weight: bold;
}

.warning {
    color: #d97706;
    font-weight: bold;
}

.bad {
    color: #dc2626;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px;
}

.sale-profit {
    font-size: 20px;
    font-weight: bold;
    color: #16a34a;
}

@media(max-width:700px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width:400px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
</style>

<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<header>
    <h1>📦 Reseller Inventory</h1>
    <p>Inventory • Barcode • Pricing • Sales • Profit</p>
</header>

<div class="container">

<!-- DASHBOARD -->

<div class="dashboard">

    <div class="card">
        <h3>STOCK UNITS</h3>
        <strong id="totalItems">0</strong>
    </div>

    <div class="card">
        <h3>STOCK COST</h3>
        <strong id="totalCost">$0.00</strong>
    </div>

    <div class="card">
        <h3>POTENTIAL SALES</h3>
        <strong id="totalSales">$0.00</strong>
    </div>

    <div class="card">
        <h3>POTENTIAL PROFIT</h3>
        <strong id="totalProfit">$0.00</strong>
    </div>

</div>


<!-- BARCODE SCANNER -->

<div class="panel">

    <h2>📷 Barcode Scanner</h2>

    <p>
        Scan a barcode to find existing stock or identify a new product.
    </p>

    <div class="actions">

        <button class="primary" onclick="startScanner()">
            📷 Start Scanner
        </button>

        <button class="secondary" onclick="stopScanner()">
            Stop Scanner
        </button>

    </div>

    <div class="scanner-box" id="scannerBox">
        <div id="reader"></div>
    </div>

    <label style="display:block;margin-top:15px;">
        Manual Barcode Lookup
    </label>

    <input
        id="barcodeSearch"
        placeholder="Enter barcode">

    <div class="actions">

        <button class="success" onclick="lookupBarcode()">
            🔎 Find Product
        </button>

    </div>

    <div id="barcodeResult"></div>

</div>


<!-- ADD ITEM -->

<div class="panel">

    <h2>➕ Add / Edit Item</h2>

    <div class="form-grid">

        <div>
            <label>Item Name</label>
            <input id="name" placeholder="Product name">
        </div>

        <div>
            <label>Barcode</label>
            <input id="barcode" placeholder="Barcode">
        </div>

        <div>
            <label>Category</label>

            <select id="category">
                <option>Console</option>
                <option>Game</option>
                <option>Controller</option>
                <option>Accessory</option>
                <option>Other</option>
            </select>
        </div>

        <div>
            <label>Platform</label>

            <select id="platform">
                <option>PlayStation 5</option>
                <option>PlayStation 4</option>
                <option>Xbox</option>
                <option>Nintendo Switch</option>
                <option>Wii</option>
                <option>Other</option>
            </select>
        </div>

        <div>
            <label>Condition</label>

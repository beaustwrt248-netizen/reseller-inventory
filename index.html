<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Inventory</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
}

header h1{margin:0 0 5px}
header p{margin:0;opacity:.8}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin:0 0 8px;
    font-size:13px;
    color:#6b7280;
}

.card strong{font-size:22px}

.panel{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.panel h2{margin-top:0}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

label{
    font-weight:bold;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#dc2626;color:white}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.scanner-box{
    display:none;
    margin-top:15px;
    border:2px solid #2563eb;
    border-radius:12px;
    padding:10px;
}

#reader{
    width:100%;
}

.search{
    margin-bottom:15px;
}

.item{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}

.item-name{
    font-size:19px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    background:#e5e7eb;
    border-radius:20px;
    font-size:12px;
    margin:5px 4px 0 0;
}

.item-details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:12px;
}

.detail{
    background:#f9fafb;
    padding:10px;
    border-radius:8px;
}

.detail small{
    display:block;
    color:#6b7280;
}

.profit{
    font-weight:bold;
}

.barcode{
    font-family:monospace;
    font-size:14px;
    color:#374151;
}

.stock-good{color:#16a34a;font-weight:bold}
.stock-low{color:#d97706;font-weight:bold}
.stock-out{color:#dc2626;font-weight:bold}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

@media(max-width:700px){
    .dashboard{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr}
    .item-details{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:400px){
    .dashboard{grid-template-columns:1fr}
}
</style>

<!-- Barcode scanning library -->
<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<header>
    <h1>📦 Reseller Inventory</h1>
    <p>Inventory, barcode and profit tracker</p>
</header>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <h3>STOCK UNITS</h3>
            <strong id="totalItems">0</strong>
        </div>

        <div class="card">
            <h3>MONEY INVESTED</h3>
            <strong id="totalCost">$0.00</strong>
        </div>

        <div class="card">
            <h3>POTENTIAL SALES</h3>
            <strong id="totalSales">$0.00</strong>
        </div>

        <div class="card">
            <h3>POTENTIAL PROFIT</h3>
            <strong id="totalProfit">$0.00</strong>
        </div>

    </div>

    <!-- BARCODE SCANNER -->

    <div class="panel">

        <h2>📷 Barcode Scanner</h2>

        <p>
            Scan a barcode to find matching stock.
        </p>

        <div class="actions">

            <button
                class="primary"
                onclick="startScanner()">
                📷 Start Scanner
            </button>

            <button
                class="secondary"
                onclick="stopScanner()">
                Stop Scanner
            </button>

        </div>

        <div class="scanner-box" id="scannerBox">
            <div id="reader"></div>
        </div>

        <div style="margin-top:15px">

            <label>Manual Barcode Lookup</label>

            <input
                id="barcodeSearch"
                placeholder="Enter barcode">

            <div class="actions">

                <button
                    class="success"
                    onclick="lookupBarcode()">
                    🔎 Find Item
                </button>

            </div>

        </div>

        <div id="barcodeResult"></div>

    </div>

    <!-- ADD ITEM -->

    <div class="panel">

        <h2>➕ Add Inventory Item</h2>

        <div class="form-grid">

            <div>
                <label>Item Name</label>
                <input
                    id="name"
                    placeholder="e.g. Mario Kart 8 Deluxe">
            </div>

            <div>
                <label>Barcode</label>
                <input
                    id="barcode"
                    placeholder="Scan or enter barcode">
            </div>

            <div>
                <label>Category</label>

                <select id="category">

                    <option>Console</option>
                    <option>Game</option>
                    <option>Controller</option>
                    <option>Accessory</option>
                    <option>Other</option>

                </select>

            </div>

            <div>
                <label>Platform</label>

                <select id="platform">

                    <option>PlayStation 5</option>
                    <option>PlayStation 4</option>
                    <option>Xbox</option>
                    <option>Nintendo Switch</option>
                    <option>Wii</option>
                    <option>Other</option>

                </select>

            </div>

            <div>
                <label>Condition</label>

                <select id="condition">

                    <option>New</option>
                    <option>Like New</option>
                    <option>Used - Good</option>
                    <option>Used - Fair</option>
                    <option>For Parts</option>

                </select>

            </div>

            <div>
                <label>Quantity</label>

                <input
                    id="quantity"
                    type="number"
                    min="1"
                    value="1">

            </div>

            <div>
                <label>Cost Price ($)</label>

                <input
                    id="cost"
                    type="number"
                    min="0"
                    step="0.01">

            </div>

            <div>
                <label>Estimated RRP ($)</label>

                <input
                    id="rrp"
                    type="number"
                    min="0"
                    step="0.01">

            </div>

            <div>
                <label>Selling Price ($)</label>

                <input
                    id="selling"
                    type="number"
                    min="0"
                    step="0.01">

            </div>

        </div>

        <div class="actions">

            <button
                class="primary"
                onclick="addItem()">
                ➕ Add Item
            </button>

            <button
                class="secondary"
                onclick="clearForm()">
                Clear
            </button>

        </div>

    </div>

    <!-- INVENTORY -->

    <div class="panel">

        <h2>📦 Inventory</h2>

        <input
            class="search"
            id="search"
            placeholder="🔎 Search inventory..."
            oninput="displayItems()">

        <div id="inventoryList"></div>

    </div>

    <!-- DATA -->

    <div class="panel">

        <h2>💾 Backup</h2>

        <div class="actions">

            <button
                class="secondary"
                onclick="exportData()">
                📤 Export Inventory
            </button>

            <button
                class="secondary"
                onclick="importData()">
                📥 Import Inventory
            </button>

            <button
                class="danger"
                onclick="deleteAll()">
                🗑️ Delete Everything
            </button>

        </div>

    </div>

</div>

<script>

let inventory = JSON.parse(
    localStorage.getItem("resellerInventory") || "[]"
);

let scanner = null;

function saveData(){

    localStorage.setItem(
        "resellerInventory",
        JSON.stringify(inventory)
    );

}

function money(value){

    return "$" + Number(value).toFixed(2);

}

/* -------------------------
   ADD ITEM
------------------------- */

function addItem(){

    const name =
        document.getElementById("name").value.trim();

    const barcode =
        document.getElementById("barcode").value.trim();

    const category =
        document.getElementById("category").value;

    const platform =
        document.getElementById("platform").value;

    const condition =
        document.getElementById("condition").value;

    const quantity =
        Number(document.getElementById("quantity").value);

    const cost =
        Number(document.getElementById("cost").value);

    const rrp =
        Number(document.getElementById("rrp").value);

    const selling =
        Number(document.getElementById("selling").value);

    if(!name){

        alert("Please enter an item name.");

        return;
    }

    if(barcode){

        const existing =
            inventory.find(
                item => item.barcode === barcode
            );

        if(existing){

            alert(
                "That barcode already exists for: " +
                existing.name
            );

            return;
        }

    }

    if(quantity < 1){

        alert("Quantity must be at least 1.");

        return;
    }

    const item = {

        id: Date.now(),

        name,
        barcode,

        category,
        platform,
        condition,

        quantity,

        cost,
        rrp,
        selling,

        dateAdded:
            new Date().toISOString()

    };

    inventory.push(item);

    saveData();

    clearForm();

    displayItems();

    updateDashboard();

    alert("Item added successfully.");

}

/* -------------------------
   CLEAR FORM
------------------------- */

function clearForm(){

    document.getElementById("name").value = "";

    document.getElementById("barcode").value = "";

    document.getElementById("quantity").value = 1;

    document.getElementById("cost").value = "";

    document.getElementById("rrp").value = "";

    document.getElementById("selling").value = "";

}

/* -------------------------
   BARCODE SCANNER
------------------------- */

function startScanner(){

    document.getElementById(
        "scannerBox"
    ).style.display = "block";

    scanner =
        new Html5Qrcode("reader");

    scanner.start(

        { facingMode: "environment" },

        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 150
            }
        },

        decodedText => {

            document.getElementById(
                "barcodeSearch"
            ).value = decodedText;

            document.getElementById(
                "barcode"
            ).value = decodedText;

            lookupBarcode();

            stopScanner();

        },

        errorMessage => {

            /* Ignore scanning errors */

        }

    ).catch(error => {

        alert(
            "Camera could not be started. " +
            "Make sure camera permission is allowed."
        );

    });

}

function stopScanner(){

    if(scanner){

        scanner.stop()
            .then(() => {

                scanner.clear();

                scanner = null;

            })
            .catch(() => {

                scanner = null;

            });

    }

    document.getElementById(
        "scannerBox"
    ).style.display = "none";

}

/* -------------------------
   BARCODE LOOKUP
------------------------- */

function lookupBarcode(){

    const barcode =
        document.getElementById(
            "barcodeSearch"
        ).value.trim();

    const result =
        document.getElementById(
            "barcodeResult"
        );

    if(!barcode){

        result.innerHTML =
            "<p>Please enter or scan a barcode.</p>";

        return;
    }

    const item =
        inventory.find(
            item => item.barcode === barcode
        );

    if(!item){

        result.innerHTML = `

            <div class="item">

                <h3>❌ Barcode Not Found</h3>

                <p>
                    Barcode:
                    <strong>${escapeHtml(barcode)}</strong>
                </p>

                <button
                    class="primary"
                    onclick="useBarcodeForNewItem('${escapeJs(barcode)}')">
                    ➕ Add This Item
                </button>

            </div>

        `;

        return;
    }

    showBarcodeItem(item);

}

/* -------------------------
   SHOW BARCODE MATCH
------------------------- */

function showBarcodeItem(item){

    const result =
        document.getElementById(
            "barcodeResult"
        );

    let stockClass =
        "stock-good";

    if(item.quantity === 0)
        stockClass = "stock-out";

    else if(item.quantity <= 2)
        stockClass = "stock-low";

    result.innerHTML = `

        <div class="item">

            <div class="item-name">
                ${escapeHtml(item.name)}
            </div>

            <span class="badge">
                ${escapeHtml(item.platform)}
            </span>

            <span class="badge">
                ${escapeHtml(item.condition)}
            </span>

            <p class="barcode">
                Barcode: ${escapeHtml(item.barcode)}
            </p>

            <p class="${stockClass}">
                Stock: ${item.quantity}
            </p>

            <p>
                Cost:
                <strong>${money(item.cost)}</strong>
                <br>

                RRP:
                <strong>${money(item.rrp)}</strong>
                <br>

                Selling:
                <strong>${money(item.selling)}</strong>
                <br>

                Profit per item:
                <strong>
                    ${money(item.selling - item.cost)}
                </strong>
            </p>

            <div class="actions">

                <button
                    class="success"
                    onclick="sellItem(${item.id})">
                    💵 Sell 1
                </button>

                <button
                    class="secondary"
                    onclick="addStock(${item.id})">
                    ➕ Add Stock
                </button>

            </div>

        </div>

    `;

}

/* -------------------------
   USE UNKNOWN BARCODE
------------------------- */

function useBarcodeForNewItem(barcode){

    document.getElementById(
        "barcode"
    ).value = barcode;

    document.getElementById(
        "barcodeResult"
    ).innerHTML = "";

    document.getElementById(
        "name"
    ).focus();

}

/* -------------------------
   SELL ITEM
------------------------- */

function sellItem(id){

    const item =
        inventory.find(
            item => item.id === id
        );

    if(!item) return;

    if(item.quantity <= 0){

        alert("This item is out of stock.");

        return;
    }

    const salePrice =
        prompt(
            "Sale price:",
            item.selling.toFixed(2)
        );

    if(salePrice === null) return;

    const price =
        Number(salePrice);

    if(isNaN(price) || price < 0){

        alert("Invalid sale price.");

        return;
    }

    item.quantity--;

    if(!item.sales){
        item.sales = [];
    }

    item.sales.push({

        date:
            new Date().toISOString(),

        price

    });

    saveData();

    displayItems();

    updateDashboard();

    showBarcodeItem(item);

}

/* -------------------------
   ADD STOCK
------------------------- */

function addStock(id){

    const item =
        inventory.find(
            item => item.id === id
        );

    if(!item) return;

    const amount =
        Number(
            prompt(
                "How many units are you adding?",
                "1"
            )
        );

    if(!amount || amount < 1){

        alert("Enter a valid quantity.");

        return;
    }

    item.quantity += amount;

    saveData();

    displayItems();

    updateDashboard();

    showBarcodeItem(item);

}

/* -------------------------
   EDIT
------------------------- */

function editItem(id){

    const item =
        inventory.find(
            item => item.id === id
        );

    if(!item) return;

    document.getElementById("name").value =
        item.name;

    document.getElementById("barcode").value =
        item.barcode || "";

    document.getElementById("category").value =
        item.category;

    document.getElementById("platform").value =
        item.platform;

    document.getElementById("condition").value =
        item.condition;

    document.getElementById("quantity").value =
        item.quantity;

    document.getElementById("cost").value =
        item.cost;

    document.getElementById("rrp").value =
        item.rrp;

    document.getElementById("selling").value =
        item.selling;

    inventory =
        inventory.filter(
            item => item.id !== id
        );

    saveData();

    displayItems();

    updateDashboard();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* -------------------------
   DELETE
------------------------- */

function deleteItem(id){

    if(!confirm("Delete this item?"))
        return;

    inventory =
        inventory.filter(
            item => item.id !== id
        );

    saveData();

    displayItems();

    updateDashboard();

}

/* -------------------------
   DISPLAY
------------------------- */

function displayItems(){

    const list =
        document.getElementById(
            "inventoryList"
        );

    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    const filtered =
        inventory.filter(item => {

            return (

                item.name
                    .toLowerCase()
                    .includes(search)

                ||

                item.category
                    .toLowerCase()
                    .includes(search)

                ||

                item.platform
                    .toLowerCase()
                    .includes(search)

                ||

                item.barcode
                    .toLowerCase()
                    .includes(search)

            );

        });

    if(filtered.length === 0){

        list.innerHTML =
            '<div class="empty">No inventory items found.</div>';

        return;
    }

    list.innerHTML =
        filtered.map(item => {

            const totalCost =
                item.cost * item.quantity;

            const totalSales =
                item.selling * item.quantity;

            const totalProfit =
                totalSales - totalCost;

            const margin =
                totalSales > 0
                ? (totalProfit / totalSales) * 100
                : 0;

            let stockClass =
                "stock-good";

            if(item.quantity === 0)
                stockClass = "stock-out";

            else if(item.quantity <= 2)
                stockClass = "stock-low";

            return `

            <div class="item">

                <div class="item-name">
                    ${escapeHtml(item.name)}
                </div>

                <span class="badge">
                    ${escapeHtml(item.category)}
                </span>

                <span class="badge">
                    ${escapeHtml(item.platform)}
                </span>

                <span class="badge">
                    ${escapeHtml(item.condition)}
                </span>

                ${
                    item.barcode
                    ? `
                    <p class="barcode">
                        Barcode:
                        ${escapeHtml(item.barcode)}
                    </p>
                    `
                    : ""
                }

                <p class="${stockClass}">
                    Stock: ${item.quantity}
                </p>

                <div class="item-details">

                    <div class="detail">
                        <small>Cost</small>
                        ${money(item.cost)}
                    </div>

                    <div class="detail">
                        <small>RRP</small>
                        ${money(item.rrp)}
                    </div>

                    <div class="detail">
                        <small>Selling</small>
                        ${money(item.selling)}
                    </div>

                    <div class="detail">
                        <small>Profit</small>

                        <span class="profit">
                            ${money(
                                item.selling -
                                item.cost
                            )}
                        </span>

                    </div>

                </div>

                <p>

                    Total invested:
                    <strong>
                        ${money(totalCost)}
                    </strong>

                    <br>

                    Potential sales:
                    <strong>
                        ${money(totalSales)}
                    </strong>

                    <br>

                    Potential profit:
                    <strong>
                        ${money(totalProfit)}
                    </strong>

                    <br>

                    Margin:
                    <strong>
                        ${margin.toFixed(1)}%
                    </strong>

                </p>

                <div class="actions">

                    <button
                        class="success"
                        onclick="sellItem(${item.id})">
                        💵 Sell 1
                    </button>

                    <button
                        class="secondary"
                        onclick="addStock(${item.id})">
                        ➕ Stock
                    </button>

                    <button
                        class="secondary"
                        onclick="editItem(${item.id})">
                        ✏️ Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteItem(${item.id})">
                        🗑️ Delete
                    </button>

                </div>

            </div>

            `;

        }).join("");

}

/* -------------------------
   DASHBOARD
------------------------- */

function updateDashboard(){

    let totalItems = 0;
    let totalCost = 0;
    let totalSales = 0;

    inventory.forEach(item => {

        totalItems += item.quantity;

        totalCost +=
            item.cost *
            item.quantity;

        totalSales +=
            item.selling *
            item.quantity;

    });

    document.getElementById(
        "totalItems"
    ).textContent = totalItems;

    document.getElementById(
        "totalCost"
    ).textContent =
        money(totalCost);

    document.getElementById(
        "totalSales"
    ).textContent =
        money(totalSales);

    document.getElementById(
        "totalProfit"
    ).textContent =
        money(
            totalSales -
            totalCost
        );

}

/* -------------------------
   EXPORT
------------------------- */

function exportData(){

    const data =
        JSON.stringify(
            inventory,
            null,
            2
        );

    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "reseller-inventory.json";

    a.click();

    URL.revokeObjectURL(url);

}

/* -------------------------
   IMPORT
------------------------- */

function importData(){

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept = ".json";

    input.onchange =
        function(event){

            const file =
                event.target.files[0];

            if(!file) return;

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    try{

                        const imported =
                            JSON.parse(
                                e.target.result
                            );

                        if(
                            !Array.isArray(
                                imported
                            )
                        )
                            throw new Error();

                        inventory =
                            imported;

                        saveData();

                        displayItems();

                        updateDashboard();

                        alert(
                            "Inventory restored."
                        );

                    }
                    catch{

                        alert(
                            "Invalid inventory file."
                        );

                    }

                };

            reader.readAsText(file);

        };

    input.click();

}

/* -------------------------
   DELETE EVERYTHING
------------------------- */

function deleteAll(){

    if(
        !confirm(
            "Delete ALL inventory?"
        )
    )
        return;

    inventory = [];

    saveData();

    displayItems();

    updateDashboard();

}

/* -------------------------
   SECURITY HELPERS
------------------------- */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}

function escapeJs(text){

    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}

/* -------------------------
   START
------------------------- */

displayItems();
updateDashboard();

</script>

</body>
</html>

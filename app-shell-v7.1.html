<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><title>Beau's Reseller Hub v7.1</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f6f7fb}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./app-shell-v7.html?v=7.1.0" title="Beau's Reseller Hub"></iframe><script>(function(){const f=document.getElementById('app');function apply(){const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return;try{const sec=d.getElementById('pricing');if(!sec)return;const card=sec.querySelector('.card');if(card&&!card.dataset.buyRule){card.dataset.buyRule='v71';const sub=card.querySelector('.sub');if(sub)sub.textContent='Game buying rule: 21–30% of expected resale, with 25% as the recommended target.';const pmax=d.getElementById('pmax'),pp=d.getElementById('pprofit'),pm=d.getElementById('pmargin'),cost=d.getElementById('pcost'),res=d.getElementById('presale');let grid=card.querySelector('.priceGrid');if(grid){const boxes=grid.querySelectorAll('.priceBox');if(boxes.length>=3){boxes[0].querySelector('span').textContent='21% Conservative Buy';boxes[1].querySelector('span').textContent='25% Recommended Buy ⭐';boxes[2].querySelector('span').textContent='30% Maximum Buy';boxes[0].querySelector('strong').id='buy21';boxes[1].querySelector('strong').id='buy25';boxes[2].querySelector('strong').id='buy30';boxes[1].style.border='2px solid #6d5dfc';boxes[1].style.background='#f0efff'}}else{grid=d.createElement('div');grid.className='priceGrid';grid.style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px';[['21% Conservative Buy','buy21',false],['25% Recommended Buy ⭐','buy25',true],['30% Maximum Buy','buy30',false]].forEach(([label,id,featured])=>{const b=d.createElement('div');b.className='priceBox';b.style=featured?'border:2px solid #6d5dfc;background:#f0efff':'';b.innerHTML='<span>'+label+'</span><strong id="'+id+'">$0.00</strong>';grid.appendChild(b)});const anchor=card.querySelector('.row')||card.querySelector('.stats');if(anchor)anchor.after(grid)}const note=d.createElement('div');note.className='note';note.style='background:#fafaff;border:1px solid #e7e9f0;border-radius:14px;padding:14px;margin-top:13px';note.innerHTML='<b>Buying strategy</b><br>21% = conservative · <b>25% = recommended</b> · 30% = maximum.';card.appendChild(note);function calcBuy(){const resale=Number(res?.value||0),actual=Number(cost?.value||0),b21=resale*.21,b25=resale*.25,b30=resale*.30,profit=b25-actual,margin=b25?profit/b25*100:0;const a=d.getElementById('buy21'),b=d.getElementById('buy25'),c=d.getElementById('buy30');if(a)a.textContent='$'+b21.toFixed(2);if(b)b.textContent='$'+b25.toFixed(2);if(c)c.textContent='$'+b30.toFixed(2);if(pmax)pmax.textContent='$'+b25.toFixed(2);if(pp)pp.textContent='$'+profit.toFixed(2);if(pm)pm.textContent=margin.toFixed(1)+'%'}if(res&&!res.dataset.v71){res.dataset.v71='1';res.addEventListener('input',calcBuy)}if(cost&&!cost.dataset.v71){cost.dataset.v71='1';cost.addEventListener('input',calcBuy)}calcBuy()}catch(e){console.warn('v7.1 buying-rule upgrade',e)}}f.addEventListener('load',()=>setTimeout(apply,250));setInterval(apply,1000)})();</script></body></html>

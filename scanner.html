<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beau's Game Inventory — Scanner</title><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif;min-height:100vh}header{padding:18px 16px;background:#1877f2}header h1{margin:0;font-size:22px}main{padding:16px;max-width:700px;margin:auto}.panel{background:#1f2937;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.25)}#reader{width:100%;min-height:260px;border-radius:14px;overflow:hidden;background:#000}#reader video{width:100%!important;height:auto!important}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:700}.primary{background:#1877f2;color:#fff}.secondary{background:#374151;color:#fff}.status{margin:12px 0 0;padding:12px;border-radius:10px;background:#111827;color:#d1d5db}.warning{background:#7c2d12;color:#fff}.success{background:#166534;color:#fff}@media(max-width:480px){main{padding:10px}header{padding:15px}}</style></head><body><header><h1>📷 Beau's Game Inventory — Scanner</h1></header><main><div class="panel"><div id="reader"></div><div id="status" class="status">Starting camera…</div><div class="actions"><button id="stop" class="secondary">Close Scanner</button><button id="restart" class="primary">Restart Camera</button></div></div></main><script>'use strict';let scanner=null,running=false,starting=false,session=0;const $=id=>document.getElementById(id);const setStatus=(text,cls='')=>{$('status').textContent=text;$('status').className='status '+cls};function release(){document.querySelectorAll('video').forEach(v=>{try{if(v.srcObject){v.srcObject.getTracks().forEach(t=>{try{t.stop()}catch(e){}});v.srcObject=null}}catch(e){}})}async function cleanup(){session++;const s=scanner;scanner=null;running=false;starting=false;if(s){try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}}release();$('reader').innerHTML=''}async function start(){if(starting||running)return;await cleanup();const my=++session;starting=true;setStatus('Starting camera…');await new Promise(r=>setTimeout(r,180));if(my!==session)return;const s=new Html5Qrcode('reader');scanner=s;try{await s.start({facingMode:{ideal:'environment'}},{fps:10,qrbox:{width:250,height:150},aspectRatio:1.7777778},async code=>{if(!running||my!==session||scanner!==s)return;running=false;starting=false;setStatus('Barcode found — opening product lookup…','success');try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}scanner=null;release();location.replace('./?scanned='+encodeURIComponent(code))});if(my!==session){try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}release();return}starting=false;running=true;setStatus('Camera ready — point it at a barcode.')}catch(e){starting=false;running=false;scanner=null;release();$('reader').innerHTML='';setStatus('Camera could not be started. Check camera permission and try again.','warning')}}async function stop(){await cleanup();location.replace('./?scannerClosed=1')}$('stop').onclick=stop;$('restart').onclick=start;window.addEventListener('pagehide',release);start();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<title>Beau's Game Inventory — Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="./pricing-engine.js?v=2.5.0"></script>
<link rel="stylesheet" href="./mobile-theme.css?v=2.1.0">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:90px}header{background:#1877f2;color:white;padding:18px 16px}header h1{margin:0;font-size:22px}header p{margin:7px 0 0}main{max-width:700px;margin:auto;padding:14px}.panel{background:white;border-radius:18px;padding:16px;box-shadow:0 2px 10px #0002}#reader{width:100%;min-height:260px;background:#000;border-radius:14px;overflow:hidden}#reader video{width:100%!important;min-height:260px;object-fit:cover}.status{margin-top:12px;padding:12px;border-radius:10px;background:#eef2f7}.warning{background:#9a3412;color:white}.success{background:#166534;color:white}.permission{display:none;margin-top:10px;padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;touch-action:manipulation}.primary{background:#1877f2;color:white}.secondary{background:#e5e7eb;color:#111827}.manual{margin-top:18px}.manual label{display:block;font-weight:700}.manual input{width:100%;margin-top:6px;padding:14px;border:2px solid #d1d5db;border-radius:12px;font-size:18px}.result{margin-top:16px}.card{padding:16px;border-radius:16px;background:#f8fafc}.price{font-size:24px;font-weight:800}.row{display:flex;justify-content:space-between;padding:7px 0}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;padding:12px}.modal-card{background:white;width:100%;max-width:520px;margin:auto;border-radius:22px;padding:20px;max-height:90vh;overflow:auto}.modal-card img{display:block;width:150px;height:150px;object-fit:contain;margin:auto;background:#f3f4f6;border-radius:12px}.dark{background:#111827;color:#f3f4f6}.dark .panel,.dark .modal-card{background:#1f2937}.dark .card{background:#111827}.dark .secondary{background:#374151;color:white}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#111827;display:flex;z-index:10}.nav button{background:transparent;color:white;font-size:11px;padding:6px 2px}
</style>
</head>
<body>
<header><h1>📷 Beau's Game Inventory</h1><p>Scan a game barcode or enter it manually.</p></header>
<main><section class="panel">
<div id="reader"></div>
<div id="status" class="status">Tap Start Camera to begin.</div>
<div id="permission" class="permission">Camera access was blocked. Allow Camera for this site in your browser settings, then try again.</div>
<div class="actions"><button id="start" class="primary" type="button">📷 Start Camera</button><button id="stop" class="secondary" type="button" disabled>⏹ Stop Camera</button></div>
<div class="manual"><label for="barcode">⌨️ Barcode</label><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Enter barcode…" maxlength="32"></div>
<div class="actions"><button id="lookup" class="primary" type="button">🔎 Find Product & Pricing</button></div>
<div id="result" class="result"></div>
</section></main>
<nav class="nav"><button data-go="index.html#dashboard">📊<br>Dashboard</button><button data-go="index.html#inventory">📦<br>Inventory</button><button>📷<br>Scanner</button><button data-go="index.html#pricing">💰<br>Pricing</button><button data-go="library.html">📚<br>Library</button></nav>
<script>
'use strict';
const WORKER='https://beau-reseller-pricing.beaustwrt248.workers.dev';
let scanner=null,running=false,starting=false,token=0,current=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';
function status(t,c=''){ $('status').textContent=t; $('status').className='status '+c }
function stopTracks(){document.querySelectorAll('video').forEach(v=>{try{if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}})}
async function cleanup(){token++;const s=scanner;scanner=null;running=false;if(s){try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}}stopTracks();$('stop').disabled=true}
async function startCamera(){
 if(starting||running)return;
 if(typeof Html5Qrcode==='undefined'){status('Scanner library failed to load. Reload the page.','warning');return}
 await cleanup();
 starting=true;$('start').disabled=true;$('permission').style.display='none';status('Requesting camera access…');
 const my=token;
 try{
  if(navigator.mediaDevices?.getUserMedia){const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});stream.getTracks().forEach(t=>t.stop())}
  if(my!==token)throw Error('Cancelled');
  const s=new Html5Qrcode('reader');scanner=s;
  const cfg={fps:10,qrbox:{width:Math.min(300,Math.floor(innerWidth*.72)),height:150},aspectRatio:1.7778,disableFlip:false};
  try{await s.start({facingMode:'environment'},cfg,code=>scanSuccess(code),()=>{})}
  catch(e){await s.start({facingMode:'user'},cfg,code=>scanSuccess(code),()=>{})}
  if(my!==token)throw Error('Cancelled');
  running=true;starting=false;$('start').disabled=false;$('stop').disabled=false;status('Camera ready — point it at a game barcode.','success')
 }catch(e){starting=false;running=false;scanner=null;$('start').disabled=false;stopTracks();$('permission').style.display='block';status(e?.name==='NotAllowedError'?'Camera permission was denied. Allow Camera for this site, then try again.':'Camera could not be started. Tap Start Camera again.','warning')}
}
function scanSuccess(code){if(!running||starting)return;running=false;lookupBarcode(code)}
async function stopCamera(){await cleanup();$('start').disabled=false;status('Camera stopped. Tap Start Camera to scan again.')}
function variants(code){const c=String(code||'').replace(/\D/g,'');return [...new Set([c,c.length===13&&c[0]==='0'?c.slice(1):'',c.length>=12?c.slice(-12):''])].filter(Boolean)}
async function getJson(url,opts={}){const r=await fetch(url,{...opts,cache:'no-store',headers:{Accept:'application/json',...(opts.headers||{})}});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw Error('Invalid response '+r.status)}if(!r.ok||d?.success===false)throw Error(d?.error||d?.message||('HTTP '+r.status));return d}
async function lookupRemote(code){let last='';for(const b of variants(code)){for(const path of ['/lookup','/api/lookup','/price','']){try{return{d:await getJson(WORKER+path+'?barcode='+encodeURIComponent(b)),route:path||'root',barcode:b}}catch(e){last=e.message}}}throw Error(last||'No match')}
function normalise(d,barcode){try{if(window.BeauPricingEngine?.normalise){const x=window.BeauPricingEngine.normalise(d,barcode);if(x){x.barcode=barcode;return x}}}catch(e){}const p=d?.product||d?.item||{};const retail=Number(d?.pricing?.retailPrice||d?.retailPrice||d?.rrp||0);const market=Number(d?.pricing?.marketPrice||d?.marketPrice||0);const second=market||retail*.75;return{title:p.title||p.name||'Game',image:p.image||p.images?.[0]||'',platform:p.platform||'',barcode,retail,second,resale:second,buy:second*.7,secondEstimated:!market,confidence:market?'Medium':'Low'}}
async function lookupBarcode(code){code=String(code||'').trim();if(!code){status('Enter a barcode first.','warning');return}if(!/^[0-9A-Za-z-]{4,32}$/.test(code)){status('Please enter a valid barcode.','warning');return}await cleanup();status('Barcode read — checking pricing…');try{const q=await lookupRemote(code);const x=normalise(q.d,q.barcode);current=x;saveLibrary(x);showResult(x,q.route)}catch(e){status('Barcode read, but online lookup failed.','warning');$('result').innerHTML='<div class="card"><b>Barcode successfully read.</b><br>The pricing service did not return usable data.<br><small>'+esc(e.message)+'</small></div>'}}
function saveLibrary(x){let a=[];try{a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){}if(!Array.isArray(a))a=[];const i=a.findIndex(v=>String(v.barcode)===String(x.barcode));if(i>=0)a[i]={...a[i],...x};else a.unshift(x);localStorage.setItem('beauGameLibrary',JSON.stringify(a.slice(0,500)))}
function showResult(x,route){const second=x.resale??x.second;const buy=x.buy??Number(second)*.7;$('result').innerHTML='<div class="card"><h2>'+esc(x.title||'Game')+'</h2><div class="row"><span>Barcode</span><b>'+esc(x.barcode)+'</b></div><div class="row"><span>New / RRP</span><b>'+money(x.retail)+'</b></div><div class="row"><span>Second-hand</span><b>'+money(second)+'</b></div><div class="row"><span>Suggested max buy</span><b class="price">'+money(buy)+'</b></div><p>Pricing source: '+esc(route)+'</p><button class="primary" id="details">View Deal Analyzer</button></div>';$('details').onclick=()=>showModal(x,buy,second)}
function showModal(x,buy,resale){$('result').insertAdjacentHTML('beforeend','<div class="modal"><div class="modal-card">'+(x.image?'<img src="'+esc(x.image)+'" alt="Game">':'')+'<h2>'+esc(x.title||'Game')+'</h2><p>Suggested maximum buy: <b>'+money(buy)+'</b><br>Second-hand resale guide: <b>'+money(resale)+'</b></p><label>Seller asking price</label><input id="ask" type="number" step="0.01" inputmode="decimal" placeholder="e.g. 20.00" style="width:100%;padding:14px;margin-top:6px;border:2px solid #ccc;border-radius:10px"><div id="deal" class="card" style="margin-top:12px">Enter a price to calculate profit.</div><div class="actions"><button class="secondary" id="close">Close</button><button class="primary" id="library">View Library</button></div></div></div>');$('ask').oninput=()=>{const a=Number($('ask').value);const profit=resale-a;const margin=resale?profit/resale*100:0;$('deal').innerHTML='<b>Potential profit:</b> '+money(profit)+'<br><b>Margin:</b> '+(a&&resale?margin.toFixed(1)+'%':'—')+'<br><b>Verdict:</b> '+(a<=0?'Enter a price':profit<=0?'PASS — too expensive':margin<20?'PASS — low margin':margin<40?'FAIR BUY':'GOOD BUY')};$('close').onclick=()=>document.querySelector('.modal')?.remove();$('library').onclick=()=>location.href='library.html'}
$('start').addEventListener('click',startCamera);$('stop').addEventListener('click',stopCamera);$('lookup').addEventListener('click',()=>lookupBarcode($('barcode').value));$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookupBarcode(e.target.value)}});document.querySelectorAll('.nav button[data-go]').forEach(b=>b.addEventListener('click',()=>location.href=b.dataset.go));document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)cleanup()});window.addEventListener('pagehide',cleanup);
</script>
</body>
</html>

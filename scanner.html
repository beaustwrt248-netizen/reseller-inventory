<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<meta name="description" content="Barcode scanner for Beau's Game Inventory">
<title>Beau's Game Inventory — Scanner</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<link rel="stylesheet" href="./mobile-theme.css?v=1.9.3">
<style>
:root{--nav-h:72px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px)!important}
header{padding:18px 16px;background:#1877f2;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header h1{margin:0;font-size:22px;line-height:1.2}header p{margin:7px 0 0;opacity:.95;line-height:1.35}
main{padding:16px;max-width:700px;margin:auto}.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.10)}
#reader{width:100%;min-height:260px;border-radius:16px;overflow:hidden;background:#000}#reader video{width:100%!important;height:auto!important;min-height:260px;object-fit:cover;display:block}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.actions button{flex:1 1 180px;border:0;border-radius:12px;padding:14px 12px;font-size:16px;font-weight:700;min-height:50px;touch-action:manipulation}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.secondary:disabled{color:#6b7280}
.status{margin:12px 0 0;padding:12px;border-radius:10px;background:#eef2f7;color:#374151;line-height:1.35}.warning{background:#9a3412;color:#fff}.success{background:#166534;color:#fff}
.mobile-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))!important;z-index:2147483647!important;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:2px!important;padding:5px 4px env(safe-area-inset-bottom,0px)!important;background:#111827!important;border-top:1px solid #374151!important;box-shadow:0 -2px 10px rgba(0,0,0,.35)!important}
.mobile-nav a{color:#fff!important;text-decoration:none!important;text-align:center;font-size:11px!important;font-weight:700;padding:5px 1px;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;gap:2px;min-width:0;line-height:1.1;overflow:hidden}.mobile-nav a span{display:block!important;font-size:20px!important;line-height:22px}.mobile-nav a.active{color:#60a5fa!important;background:#1f2937;border-radius:8px}
@media(max-width:480px){main{padding:10px}header{padding:15px}.panel{padding:12px}.mobile-nav a{font-size:10px!important}.mobile-nav a span{font-size:18px!important}}
</style>
</head>
<body>
<header><h1>📷 Beau's Game Inventory — Scanner</h1><p>Scan a game barcode to open its product and pricing lookup.</p></header>
<main><section class="panel">
<div id="reader" aria-label="Camera barcode scanner"></div>
<div id="status" class="status" role="status" aria-live="polite">Tap Start Camera, then allow camera access when Android asks.</div>
<div class="actions"><button id="start" class="primary" type="button">📷 Start Camera</button><button id="stop" class="secondary" type="button" disabled>⏹ Stop Camera</button></div>
</section></main>
<nav class="mobile-nav" aria-label="App navigation">
<a href="./#dashboard"><span aria-hidden="true">📊</span><span>Dashboard</span></a><a href="./#inventory"><span aria-hidden="true">📦</span><span>Inventory</span></a><a href="./scanner.html" class="active" aria-current="page"><span aria-hidden="true">📷</span><span>Scanner</span></a><a href="./#pricing"><span aria-hidden="true">💰</span><span>Pricing</span></a><a href="./#sales"><span aria-hidden="true">🧾</span><span>Sales</span></a><a href="./#settings"><span aria-hidden="true">⚙️</span><span>Settings</span></a>
</nav>
<script>
'use strict';
let scanner=null,running=false,starting=false,session=0;
const $=id=>document.getElementById(id);
function setStatus(text,cls=''){const el=$('status');el.textContent=text;el.className='status '+cls}
function releaseTracks(){document.querySelectorAll('video').forEach(v=>{try{v.pause();if(v.srcObject){v.srcObject.getTracks().forEach(t=>{try{t.stop()}catch(e){}});v.srcObject=null}}catch(e){}})}
async function cleanup(){session++;const s=scanner;scanner=null;running=false;starting=false;$('stop').disabled=true;if(s){try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}}releaseTracks();$('reader').replaceChildren()}
function cameraError(e){const name=String(e?.name||'').toLowerCase(),msg=String(e?.message||e||'').toLowerCase();if(name.includes('notallowed')||msg.includes('permission')||msg.includes('notallowed'))return'Camera permission was denied. Allow Camera permission for Beau\'s Game Inventory in Android Settings, then try again.';if(name.includes('notfound')||msg.includes('notfound'))return'No camera was found on this device.';if(name.includes('notreadable')||msg.includes('notreadable')||msg.includes('trackstart'))return'The camera is busy or unavailable. Close other apps using the camera, then try again.';if(name.includes('security'))return'Camera access is blocked by the current WebView/browser. Install the latest APK and try again.';return'Camera could not be started. Tap Start Camera again. If it still fails, install the latest APK so the Android camera permission fix is installed.'}
async function getRearCamera(){if(!window.Html5Qrcode||typeof Html5Qrcode.getCameras!=='function')return null;try{const cams=await Html5Qrcode.getCameras();if(!cams?.length)return null;const rear=cams.find(c=>/back|rear|environment|facing back/i.test(c.label||''));return(rear||cams[0]).id||null}catch(e){return null}}
async function start(){if(starting||running)return;if(typeof Html5Qrcode==='undefined'){setStatus('Scanner library did not load. Check your internet connection and try again.','warning');return}await cleanup();const my=++session;starting=true;$('start').disabled=true;setStatus('Requesting camera access…');try{const cameraId=await getRearCamera();if(my!==session)return;const s=new Html5Qrcode('reader');scanner=s;const cameraConfig=cameraId?cameraId:{facingMode:'environment'};setStatus('Starting rear camera…');await s.start(cameraConfig,{fps:10,qrbox:{width:250,height:150},aspectRatio:1.7777778,disableFlip:true},async code=>{if(!running||my!==session||scanner!==s)return;running=false;starting=false;setStatus('Barcode found — opening product lookup…','success');try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}scanner=null;releaseTracks();location.replace('./?scanned='+encodeURIComponent(String(code).trim()))});if(my!==session){try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}return}starting=false;running=true;$('stop').disabled=false;$('start').disabled=false;setStatus('Camera ready — point it at a barcode.','success')}catch(e){starting=false;running=false;scanner=null;$('start').disabled=false;$('stop').disabled=true;releaseTracks();$('reader').replaceChildren();setStatus(cameraError(e),'warning')}}
async function stop(){await cleanup();setStatus('Camera stopped. Tap Start Camera to scan again.');$('start').disabled=false}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);window.addEventListener('pagehide',()=>{cleanup()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)cleanup()});
</script>
</body>
</html>

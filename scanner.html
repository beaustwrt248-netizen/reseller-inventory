<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1877f2"><title>Beau's Game Inventory — Scanner</title><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><link rel="stylesheet" href="./mobile-theme.css?v=2.0.0"><link rel="stylesheet" href="./nav-icons.css?v=2.0.0"><style>
:root{--nav-h:72px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px)!important}header{padding:18px 16px;background:#1877f2;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}header h1{margin:0;font-size:22px}header p{margin:7px 0 0;line-height:1.35}main{padding:16px;max-width:700px;margin:auto}.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.1)}#reader{width:100%;min-height:260px;border-radius:16px;overflow:hidden;background:#000}#reader video{width:100%!important;height:auto!important;min-height:260px;object-fit:cover;display:block}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.actions button{flex:1 1 180px;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;min-height:50px}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.status{margin-top:12px;padding:12px;border-radius:10px;background:#eef2f7;line-height:1.35}.warning{background:#9a3412;color:#fff}.success{background:#166534;color:#fff}.manual{margin-top:18px}.manual input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:17px}.mobile-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))!important;z-index:9999!important;background:#111827!important;border-top:1px solid #374151!important;padding:5px 4px env(safe-area-inset-bottom,0px)!important}.result{margin-top:18px}.lookup-modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:10000;display:flex;align-items:flex-end;justify-content:center;padding:14px}.lookup-card{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 16px 16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}.lookup-card img{display:block;width:170px;height:170px;object-fit:contain;margin:4px auto 18px;border-radius:16px;background:#f3f4f6}.lookup-card h2{text-align:center;margin:0 0 6px;font-size:23px}.sub{text-align:center;color:#6b7280;margin:0 0 18px}.estimate{display:grid;grid-template-columns:1fr 1fr;gap:12px}.estimate-box{padding:17px;border-radius:16px;background:#f3f4f6;text-align:center}.estimate-box span{display:block;color:#6b7280;font-size:13px;font-weight:700;text-transform:uppercase}.estimate-box strong{display:block;font-size:26px;margin-top:7px}.buy{color:#1877f2}.used{color:#15803d}.source{margin-top:15px;padding:12px;border-radius:12px;background:#f8fafc;color:#4b5563;font-size:13px}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px}@media(max-width:420px){main{padding:10px}.lookup-card{padding:18px}.lookup-card img{width:145px;height:145px}}
body.dark-mode{background:#111827;color:#f3f4f6}body.dark-mode .panel,body.dark-mode .lookup-card{background:#1f2937;color:#f3f4f6}body.dark-mode .secondary{background:#374151;color:#fff}body.dark-mode .manual input{background:#111827;color:#fff;border-color:#4b5563}body.dark-mode .estimate-box,body.dark-mode .source{background:#111827;color:#e5e7eb}
</style></head><body><header><h1>📷 Beau's Game Inventory</h1><p>Scan a game barcode to instantly check new and second-hand prices.</p></header><main><section class="panel"><div id="reader"></div><div id="status" class="status">Tap Start Camera, then allow camera access.</div><div class="actions"><button id="start" class="primary">📷 Start Camera</button><button id="stop" class="secondary" disabled>⏹ Stop Camera</button></div><div class="manual"><strong>Manual Barcode</strong><input id="manualBarcode" inputmode="numeric" placeholder="Enter barcode"></div><div class="actions"><button id="manualLookup" class="primary">🔎 Search Game</button></div><div id="result" class="result"></div></section></main><nav class="mobile-nav" aria-label="App navigation"><button data-go="index.html#dashboard"><span class="icon"></span><span class="label">Dashboard</span></button><button data-go="index.html#inventory"><span class="icon"></span><span class="label">Inventory</span></button><button class="active"><span class="icon"></span><span class="label">Scanner</span></button><button data-go="index.html#pricing"><span class="icon"></span><span class="label">Pricing</span></button><button data-go="library.html"><span class="icon"></span><span class="label">Library</span></button><button data-go="index.html#settings"><span class="icon"></span><span class="label">Settings</span></button></nav>
<script>
'use strict';const WORKER='https://beau-reseller-pricing.beaustwrt248.workers.dev';let scanner=null,running=false,starting=false,session=0;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';
function setStatus(t,c=''){const e=$('status');e.textContent=t;e.className='status '+c}function release(){document.querySelectorAll('video').forEach(v=>{try{v.pause();v.srcObject?.getTracks().forEach(t=>t.stop());v.srcObject=null}catch(e){}})}async function cleanup(){session++;const s=scanner;scanner=null;running=false;starting=false;$('stop').disabled=true;if(s){try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}}release();$('reader').replaceChildren()}
function cameraError(e){const s=String(e?.name||e?.message||e||'').toLowerCase();if(s.includes('notallowed')||s.includes('permission'))return'Camera permission was denied. Allow camera access in Android Settings.';if(s.includes('notfound'))return'No camera was found on this device.';if(s.includes('notreadable')||s.includes('trackstart'))return'The camera is busy. Close other apps using the camera and try again.';return'Camera could not be started. Tap Start Camera again.'}
async function rear(){try{const cs=await Html5Qrcode.getCameras();return cs?.find(c=>/back|rear|environment/i.test(c.label||''))?.id||cs?.[0]?.id||null}catch(e){return null}}
async function start(){if(starting||running)return;await cleanup();starting=true;$('start').disabled=true;setStatus('Requesting camera access…');const my=++session;try{const id=await rear();const s=new Html5Qrcode('reader');scanner=s;await s.start(id||{facingMode:'environment'},{fps:10,qrbox:{width:250,height:150},aspectRatio:1.7778,disableFlip:true},code=>{if(my!==session||!running)return;running=false;lookup(code)});if(my!==session)return;starting=false;running=true;$('stop').disabled=false;$('start').disabled=false;setStatus('Camera ready — point it at a game barcode.','success')}catch(e){starting=false;running=false;scanner=null;$('start').disabled=false;release();$('reader').replaceChildren();setStatus(cameraError(e),'warning')}}
async function stop(){await cleanup();$('start').disabled=false;setStatus('Camera stopped. Tap Start Camera to scan again.')}
function normalise(d,barcode){const p=d?.product||d?.products?.[0]||d?.data?.products?.[0]||d?.data?.product||d?.result?.products?.[0]||d?.result?.product;if(!p)throw Error('No matching game was found for that barcode.');const pricing=d?.pricing||{};const title=p.title||p.name||p.product_name||'Unknown game';const image=p.image||p.image_url||p.images?.[0]||'';const retail=Number(pricing.retailPrice||p.retail_price||p.rrp||p.current_price||p.price||0);const second=Number(pricing.secondHandPrice||p.market_price||p.used_price||p.second_hand_price||p.used||0);const resale=Number(pricing.suggestedResale)>0?Number(pricing.suggestedResale):(second||retail*.75);const buy=Number(pricing.maximumBuy)>0?Number(pricing.maximumBuy):resale*.70;const platform=p.platform||p.console||p.system||'';return{title,image,platform,retail,second,resale,buy,barcode,sources:Array.isArray(d?.stores)?d.stores:[]}}
async function lookup(code){code=String(code||'').trim();if(!code)return;await cleanup();setStatus('Searching online pricing…');try{const r=await fetch(WORKER+'/price?barcode='+encodeURIComponent(code),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d?.message||d?.error||'Pricing service unavailable.');const x=normalise(d,code);saveLibrary(x);show(x)}catch(e){setStatus(e.message||'Game lookup failed.','warning')}}
function saveLibrary(x){let a=[];try{a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){}if(!Array.isArray(a))a=[];const i=a.findIndex(v=>String(v.barcode)===String(x.barcode));const item={...x,checkedAt:new Date().toISOString()};if(i>=0)a[i]=item;else a.unshift(item);localStorage.setItem('beauGameLibrary',JSON.stringify(a.slice(0,500)))}
function show(x){$('result').innerHTML=`<div class="lookup-modal"><div class="lookup-card"><button id="closeLookup" style="float:right;border:0;background:none;font-size:26px">×</button>${x.image?`<img src="${esc(x.image)}" alt="Game thumbnail">`:'<div style="height:80px"></div>'}<h2>${esc(x.title)}</h2><p class="sub">${esc(x.platform||'Game')} • Barcode ${esc(x.barcode)}</p><div class="estimate"><div class="estimate-box"><span>Estimated buy price</span><strong class="buy">${money(x.buy)}</strong></div><div class="estimate-box"><span>Estimated second-hand value</span><strong class="used">${money(x.resale)}</strong></div></div><div class="source"><strong>New price:</strong> ${money(x.retail)}<br><strong>Second-hand market:</strong> ${money(x.second)}<br><small>Buy estimate is calculated from the resale estimate; use it as a guide, not a guaranteed market price.</small></div><div class="modal-actions"><button class="secondary" id="closeLookup2">Close</button><button class="primary" id="libraryLookup">View Library</button></div></div></div>`;$('closeLookup').onclick=close;$('closeLookup2').onclick=close;$('libraryLookup').onclick=()=>location.href='./library.html'}function close(){$('result').innerHTML='';setStatus('Ready to scan another game.','success')}
$('start').onclick=start;$('stop').onclick=stop;$('manualLookup').onclick=()=>lookup($('manualBarcode').value);$('manualBarcode').addEventListener('keydown',e=>{if(e.key==='Enter')lookup(e.target.value)});document.querySelectorAll('.mobile-nav button[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanup()});window.addEventListener('pagehide',cleanup);
</script></body></html>

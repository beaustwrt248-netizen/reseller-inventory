<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beau's Game Inventory — Scanner</title><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><link rel="stylesheet" href="./mobile-theme.css"><style>body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:78px}header{background:#111827;color:#fff;padding:18px 14px}.wrap{max-width:900px;margin:auto;padding:12px}.panel{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}button,input{font-size:16px;border-radius:9px;padding:13px}input{width:100%;box-sizing:border-box;border:1px solid #d1d5db}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;font-weight:bold}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.reader{margin-top:12px;border:2px solid #2563eb;border-radius:12px;overflow:hidden}.zoom{display:none;margin-top:12px;padding:12px;background:#f9fafb;border-radius:10px}.zoom input{padding:0}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f9fafb}.mobile-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#111827;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding:5px}.mobile-nav a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:bold;padding:7px}.mobile-nav span{display:block;font-size:20px}@media(min-width:701px){.mobile-nav{display:none}}</style></head><body><header><div class="wrap"><h1 style="margin:0">📷 Barcode Scanner</h1><p style="margin:5px 0;opacity:.8">Beau's Game Inventory</p></div></header><main class="wrap"><section class="panel"><h2>Scan a game or barcode</h2><p>Use your phone camera to scan EAN, UPC and common game barcodes.</p><div class="actions"><button class="primary" id="start">📷 Start Camera</button><button class="secondary" id="stop">Stop</button></div><div id="reader" class="reader"></div><div id="zoom" class="zoom"><strong>🔍 Zoom <span id="zv">1×</span></strong><input id="zs" type="range" min="1" max="5" step="0.1" value="1"></div><div id="result" class="result">Scanner ready.</div></section><section class="panel"><h2>Manual Barcode</h2><input id="barcode" inputmode="numeric" placeholder="Enter barcode"><div class="actions"><button class="primary" id="lookup">🔎 Find Pricing</button></div></section></main><nav class="mobile-nav"><a href="./dashboard.html"><span>📊</span>Dashboard</a><a href="./"><span>📦</span>Inventory</a><a href="./pricing.html"><span>💰</span>Pricing</a><a href="./scanner.html"><span>📷</span>Scanner</a></nav><script>const W='https://beau-reseller-pricing.beaustwrt248.workers.dev';let s=null,running=false,min=1,max=1;const result=document.getElementById('result');function lookup(b){b=(b||document.getElementById('barcode').value).trim();if(!b)return alert('Enter or scan a barcode.');document.getElementById('barcode').value=b;location.href='./pricing.html?barcode='+encodeURIComponent(b)}async function start(){if(running)return;if(typeof Html5Qrcode==='undefined')return alert('Scanner library has not loaded.');s=new Html5Qrcode('reader');try{await s.start({facingMode:{exact:'environment'}},{fps:10,qrbox:(w,h)=>({width:Math.min(300,w*.8),height:Math.min(190,h*.5)}),formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39]},async t=>{await stop();lookup(t)},()=>{});running=true;setTimeout(setupZoom,300)}catch(e){console.error(e);alert('Camera could not start. Check camera permission and HTTPS.')}}async function stop(){if(s){try{if(running)await s.stop()}catch(e){}try{await s.clear()}catch(e){}}s=null;running=false;document.getElementById('zoom').style.display='none'}function setupZoom(){try{let c=s.getRunningTrackCapabilities();if(!c||!c.zoom)return;min=+c.zoom.min||1;max=+c.zoom.max||1;let z=document.getElementById('zs');z.min=min;z.max=max;z.step=c.zoom.step||.1;z.value=min;document.getElementById('zv').textContent=min+'×';document.getElementById('zoom').style.display='block'}catch(e){}}async function zoom(v){if(!s||!running)return;try{await s.applyVideoConstraints({advanced:[{zoom:+v}]});document.getElementById('zv').textContent=(+v)+'×'}catch(e){}}document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;document.getElementById('lookup').onclick=()=>lookup();document.getElementById('zs').oninput=e=>zoom(e.target.value);let q=new URLSearchParams(location.search).get('barcode');if(q){document.getElementById('barcode').value=q;lookup(q)}</script></body></html>

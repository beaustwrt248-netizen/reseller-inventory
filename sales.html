<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beau's Game Inventory — Sales</title><link rel="stylesheet" href="./mobile-theme.css"><style>body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:80px}header{background:#111827;color:#fff;padding:18px 14px}.wrap{max-width:900px;margin:auto;padding:12px}.panel{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:14px}input,select{width:100%;padding:13px;margin-top:5px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 16px;font-weight:bold;font-size:15px}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.danger{background:#dc2626;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.stat small{display:block;color:#6b7280}.stat strong{font-size:20px}.sale{border:1px solid #e5e7eb;border-radius:11px;padding:13px;margin-top:10px}.row{display:flex;justify-content:space-between;padding:6px 0;gap:8px}.profit{color:#15803d;font-weight:bold}.empty{text-align:center;color:#6b7280;padding:25px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px;border-radius:10px;margin-bottom:12px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#111827;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:5px}.mobile-nav a{color:#fff;text-decoration:none;text-align:center;font-size:10px;font-weight:bold;padding:7px}.mobile-nav span{display:block;font-size:19px}@media(max-width:700px){.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.actions button{width:100%}}@media(min-width:701px){.mobile-nav{display:none}}</style></head><body><header><div class="wrap"><h1 style="margin:0">🧾 Sales</h1><p style="margin:5px 0;opacity:.8">Sell stock and track real profit</p></div></header><main class="wrap"><section class="panel"><div class="stats"><div class="stat"><small>SALES</small><strong id="count">0</strong></div><div class="stat"><small>REVENUE</small><strong id="revenue">$0.00</strong></div><div class="stat"><small>PROFIT</small><strong id="profit">$0.00</strong></div><div class="stat"><small>UNITS SOLD</small><strong id="unitsSold">0</strong></div></div></section><section class="panel"><h2>📦 Sell Inventory</h2><div class="notice">Choose an inventory item and its quantity. Recording the sale automatically reduces stock.</div><label>Inventory Item<select id="inventorySelect"><option value="">Select an item…</option></select></label><div class="form" style="margin-top:12px"><label>Quantity Sold<input id="qty" type="number" min="1" value="1"></label><label>Sale Price Per Unit ($)<input id="salePrice" type="number" min="0" step="0.01"></label><label>Cost Per Unit ($)<input id="cost" type="number" min="0" step="0.01"></label><label>Fees ($)<input id="fees" type="number" min="0" step="0.01" value="0"></label><label>Shipping ($)<input id="shipping" type="number" min="0" step="0.01" value="0"></label><label>Date<input id="date" type="date"></label></div><div class="actions"><button class="primary" id="add">💰 Complete Sale</button><button class="secondary" id="manual">✍️ Manual Sale</button></div></section><section class="panel" id="manualPanel" style="display:none"><h2>✍️ Manual Sale</h2><div class="form"><label>Item<input id="manualItem" placeholder="Game or console"></label><label>Sale Price ($)<input id="manualPrice" type="number" min="0" step="0.01"></label><label>Cost ($)<input id="manualCost" type="number" min="0" step="0.01"></label></div><div class="actions"><button class="primary" id="addManual">Record Manual Sale</button></div></section><section class="panel"><h2>📋 Sales History</h2><div id="list"></div><div class="actions"><button class="secondary" id="export">📤 Export Sales</button><button class="danger" id="clear">🗑️ Clear Sales</button></div></section></main><nav class="mobile-nav"><a href="./dashboard.html"><span>📊</span>Dashboard</a><a href="./"><span>📦</span>Inventory</a><a href="./pricing.html"><span>💰</span>Pricing</a><a href="./sales.html"><span>🧾</span>Sales</a><a href="./scanner.html"><span>📷</span>Scanner</a></nav><script>let sales=[],inventory=[];try{sales=JSON.parse(localStorage.getItem('resellerSales')||'[]');if(!Array.isArray(sales))sales=[]}catch(e){sales=[]}function loadInventory(){try{inventory=JSON.parse(localStorage.getItem('resellerInventory')||'[]');if(!Array.isArray(inventory))inventory=[]}catch(e){inventory=[]}}const money=v=>'$'+Number(v||0).toFixed(2);function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function save(){localStorage.setItem('resellerSales',JSON.stringify(sales));localStorage.setItem('resellerInventory',JSON.stringify(inventory));window.dispatchEvent(new StorageEvent('storage',{key:'resellerInventory'}))}function populate(){loadInventory();const s=document.getElementById('inventorySelect');s.innerHTML='<option value="">Select an item…</option>'+inventory.filter(i=>Number(i.quantity||0)>0).map(i=>`<option value="${esc(i.id)}">${esc(i.name)} — ${Number(i.quantity||0)} in stock</option>`).join('');}function selectItem(){const i=inventory.find(x=>String(x.id)===String(inventorySelect.value));if(!i)return;salePrice.value=Number(i.selling||i.marketPrice||0);cost.value=Number(i.cost||0);qty.max=Number(i.quantity||1);qty.value=1}function render(){const rev=sales.reduce((a,s)=>a+Number(s.price||0)*Number(s.quantity||1),0),p=sales.reduce((a,s)=>a+Number(s.profit||0),0),units=sales.reduce((a,s)=>a+Number(s.quantity||1),0);count.textContent=sales.length;revenue.textContent=money(rev);profit.textContent=money(p);unitsSold.textContent=units;list.innerHTML=sales.length?sales.slice().reverse().map((s,i)=>`<div class="sale"><strong>${esc(s.item)}</strong><div class="row"><span>Date</span><span>${esc(s.date)}</span></div><div class="row"><span>Quantity</span><strong>${Number(s.quantity||1)}</strong></div><div class="row"><span>Revenue</span><strong>${money(Number(s.price||0)*Number(s.quantity||1))}</strong></div><div class="row"><span>Fees + shipping</span><span>${money(Number(s.fees||0)+Number(s.shipping||0))}</span></div><div class="row"><span>Profit</span><strong class="profit">${money(s.profit)}</strong></div><div class="actions"><button class="danger" onclick="removeSale(${sales.length-1-i})">Delete Sale</button></div></div>`).join(''):'<div class="empty">No sales recorded yet.</div>'}function completeSale(){const item=inventory.find(x=>String(x.id)===String(inventorySelect.value));if(!item)return alert('Select an inventory item first.');const q=Math.max(1,Number(qty.value||1));if(q>Number(item.quantity||0))return alert('You cannot sell more than the current stock.');const price=Number(salePrice.value||0),unitCost=Number(cost.value||0),fees=Number(document.getElementById('fees').value||0),shipping=Number(document.getElementById('shipping').value||0);if(price<=0)return alert('Enter the sale price.');const profit=price*q-unitCost*q-fees-shipping;sales.push({id:Date.now(),item:item.name,barcode:item.barcode||'',quantity:q,price,cost:unitCost,fees,shipping,profit,date:date.value||new Date().toISOString().slice(0,10)});item.quantity=Number(item.quantity||0)-q;save();populate();render();alert('✅ Sale recorded and stock updated.');inventorySelect.value='';salePrice.value='';cost.value='';qty.value=1;document.getElementById('fees').value=0;document.getElementById('shipping').value=0}function manualSale(){document.getElementById('manualPanel').style.display=document.getElementById('manualPanel').style.display==='none'?'block':'none'}function addManual(){const n=manualItem.value.trim(),price=Number(manualPrice.value||0),c=Number(manualCost.value||0);if(!n||price<=0)return alert('Enter an item and sale price.');sales.push({id:Date.now(),item:n,quantity:1,price,cost:c,fees:0,shipping:0,profit:price-c,date:date.value||new Date().toISOString().slice(0,10)});localStorage.setItem('resellerSales',JSON.stringify(sales));render();manualItem.value='';manualPrice.value='';manualCost.value=''}function removeSale(i){if(!confirm('Delete this sale record? This does not restore inventory automatically.'))return;sales.splice(i,1);localStorage.setItem('resellerSales',JSON.stringify(sales));render()}function exportSales(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sales,null,2)],{type:'application/json'}));a.download='beau-game-sales.json';a.click();URL.revokeObjectURL(a.href)}function clearSales(){if(!confirm('Clear all sales history? Inventory will not be changed.'))return;sales=[];localStorage.setItem('resellerSales','[]');render()}inventorySelect.onchange=selectItem;add.onclick=completeSale;manual.onclick=manualSale;addManual.onclick=addManual;document.getElementById('export').onclick=exportSales;document.getElementById('clear').onclick=clearSales;date.value=new Date().toISOString().slice(0,10);loadInventory();populate();render();window.addEventListener('storage',()=>{loadInventory();populate();render()});</script></body></html>

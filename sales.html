<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beau's Game Inventory — Sales</title><link rel="stylesheet" href="./mobile-theme.css"><style>body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:80px}header{background:#111827;color:#fff;padding:18px 14px}.wrap{max-width:900px;margin:auto;padding:12px}.panel{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:14px}input,select{width:100%;padding:13px;margin-top:5px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 16px;font-weight:bold;font-size:15px}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.danger{background:#dc2626;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.stat small{display:block;color:#6b7280}.stat strong{font-size:20px}.sale{border:1px solid #e5e7eb;border-radius:11px;padding:13px;margin-top:10px}.row{display:flex;justify-content:space-between;padding:6px 0}.profit{color:#15803d;font-weight:bold}.empty{text-align:center;color:#6b7280;padding:25px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#111827;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:5px}.mobile-nav a{color:#fff;text-decoration:none;text-align:center;font-size:10px;font-weight:bold;padding:7px}.mobile-nav span{display:block;font-size:19px}@media(max-width:700px){.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.actions button{width:100%}}@media(min-width:701px){.mobile-nav{display:none}}</style></head><body><header><div class="wrap"><h1 style="margin:0">🧾 Sales</h1><p style="margin:5px 0;opacity:.8">Track completed sales and real profit</p></div></header><main class="wrap"><section class="panel"><div class="stats"><div class="stat"><small>Sales</small><strong id="count">0</strong></div><div class="stat"><small>Revenue</small><strong id="revenue">$0.00</strong></div><div class="stat"><small>Profit</small><strong id="profit">$0.00</strong></div></div></section><section class="panel"><h2>➕ Record Sale</h2><div class="form"><label>Item<input id="item" placeholder="Game or console"></label><label>Sale Price ($)<input id="salePrice" type="number" min="0" step="0.01"></label><label>Original Cost ($)<input id="cost" type="number" min="0" step="0.01"></label><label>Fees ($)<input id="fees" type="number" min="0" step="0.01" value="0"></label><label>Shipping ($)<input id="shipping" type="number" min="0" step="0.01" value="0"></label><label>Date<input id="date" type="date"></label></div><div class="actions"><button class="primary" id="add">💰 Record Sale</button></div></section><section class="panel"><h2>📋 Sales History</h2><div id="list"></div><div class="actions"><button class="secondary" id="export">📤 Export Sales</button><button class="danger" id="clear">🗑️ Clear Sales</button></div></section></main><nav class="mobile-nav"><a href="./dashboard.html"><span>📊</span>Dashboard</a><a href="./"><span>📦</span>Inventory</a><a href="./pricing.html"><span>💰</span>Pricing</a><a href="./sales.html"><span>🧾</span>Sales</a><a href="./#reader"><span>📷</span>Scanner</a></nav><script>let sales=[];try{sales=JSON.parse(localStorage.getItem('resellerSales')||'[]')}catch(e){sales=[]}const money=v=>'$'+Number(v||0).toFixed(2);date.value=new Date().toISOString().slice(0,10);function save(){localStorage.setItem('resellerSales',JSON.stringify(sales))}function render(){let rev=sales.reduce((a,s)=>a+Number(s.price),0),p=sales.reduce((a,s)=>a+Number(s.price)-Number(s.cost)-Number(s.fees)-Number(s.shipping),0);count.textContent=sales.length;revenue.textContent=money(rev);profit.textContent=money(p);list.innerHTML=sales.length?sales.slice().reverse().map((s,i)=>`<div class="sale"><strong>${esc(s.item)}</strong><div class="row"><span>Date</span><span>${esc(s.date)}</span></div><div class="row"><span>Sale</span><strong>${money(s.price)}</strong></div><div class="row"><span>Costs & fees</span><span>${money(Number(s.cost)+Number(s.fees)+Number(s.shipping))}</span></div><div class="row"><span>Profit</span><strong class="profit">${money(Number(s.price)-Number(s.cost)-Number(s.fees)-Number(s.shipping))}</strong></div><div class="actions"><button class="danger" onclick="removeSale(${sales.length-1-i})">Delete</button></div></div>`).join(''):'<div class="empty">No sales recorded yet.</div>'}function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}add.onclick=()=>{if(!item.value.trim()||!salePrice.value)return alert('Enter an item and sale price.');sales.push({item:item.value.trim(),price:+salePrice.value||0,cost:+cost.value||0,fees:+fees.value||0,shipping:+shipping.value||0,date:date.value||new Date().toISOString().slice(0,10)});save();item.value='';salePrice.value='';cost.value='';fees.value=0;shipping.value=0;render()};function removeSale(i){if(confirm('Delete this sale?')){sales.splice(i,1);save();render()}}clear.onclick=()=>{if(confirm('Clear all sales?')){sales=[];save();render()}};export.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sales,null,2)],{type:'application/json'}));a.download='beau-sales.json';a.click();URL.revokeObjectURL(a.href)};render()</script></body></html>

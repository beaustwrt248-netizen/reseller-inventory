<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1877f2"><title>Beau's Game Library</title><link rel="stylesheet" href="./mobile-theme.css?v=4.1.0"><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827;padding-bottom:90px}header{background:#1877f2;color:#fff;padding:18px}main{max-width:1000px;margin:auto;padding:16px}.top{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.box{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.game{background:#fff;border-radius:16px;padding:14px}.game h2{font-size:17px}.muted{color:#6b7280;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#111827;display:flex;z-index:100}.nav a{flex:1;background:transparent;border:0;color:#fff;font-weight:700;text-decoration:none;text-align:center;padding:10px 2px;font-size:12px}.nav a.active{background:#243244}#search{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}</style></head><body><header><h1>📚 Beau's Game Library</h1><p>Your saved scanned games.</p></header><main><section class="box"><div class="top"><a class="btn primary" href="./index.html#dashboard?v=4.1.0">← Back to App</a><a class="btn primary" href="./scanner-v3.html?v=3.2.0">📷 Scan New Game</a><a class="btn secondary" href="./library-v2.html?v=4.1.0">↻ Refresh Library</a></div></section><section class="box"><input id="search" placeholder="🔎 Search games, barcodes or platforms"></section><div id="grid" class="grid"></div></main><nav class="nav"><a href="./index.html#dashboard?v=4.1.0">📊<br>Dashboard</a><a href="./index.html#inventory?v=4.1.0">📦<br>Inventory</a><a href="./scanner-v3.html?v=3.2.0">📷<br>Scanner</a><a href="./index.html#pricing?v=4.1.0">💰<br>Pricing</a><a class="active" href="./library-v2.html?v=4.1.0">📚<br>Library</a><a href="./index.html#settings?v=4.1.0">⚙️<br>Settings</a></nav><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';function load(){let a=[];try{a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]')}catch(e){}if(!Array.isArray(a))a=[];const q=$('search').value.toLowerCase();const b=a.filter(g=>[g.title,g.barcode,g.platform].join(' ').toLowerCase().includes(q));$('grid').innerHTML=b.length?b.map(g=>`<article class="game"><h2>🎮 ${esc(g.title||'Game')}</h2><div class="muted">${esc(g.platform||'Unknown platform')}</div><p>Barcode: ${esc(g.barcode||'')}</p><p>Estimated buy: <b>${money(g.buy)}</b><br>Second-hand: <b>${money(g.resale)}</b></p></article>`).join(''):'<section class="box" style="grid-column:1/-1;text-align:center;padding:50px"><h2>📚 No saved games yet</h2><p>Scan a game and save it to your library.</p></section>'}$('search').oninput=load}load();</script></body></html>

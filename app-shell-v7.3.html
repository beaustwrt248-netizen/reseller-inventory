<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><title>Beau's Reseller Hub v7.3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f6f7fb}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./app-shell-v7.2.html?v=7.3.0" title="Beau's Reseller Hub"></iframe><script>(function(){const f=document.getElementById('app');function roundMoneyText(text){const raw=String(text||'');const n=Number(raw.replace(/[^0-9.-]/g,''));return Number.isFinite(n)?'$'+Math.round(n).toLocaleString('en-AU'):raw}function apply(){try{const d=f.contentDocument;if(!d)return;['b21','b25','b30','rs','rb','gp','du','dc','ds','dp'].forEach(id=>{const e=d.getElementById(id);if(e&&e.textContent&&(/\$/.test(e.textContent)||/^\d[\d,]*\.\d+$/.test(e.textContent)))e.textContent=roundMoneyText(e.textContent)});['gm'].forEach(id=>{const e=d.getElementById(id);if(e){const n=parseFloat(e.textContent);if(Number.isFinite(n))e.textContent=Math.round(n)+'%'}});d.querySelectorAll('#pricing .buy strong,#pricing .result b,#pricing .priceBox strong,.stat strong,#snapshot b').forEach(e=>{const t=String(e.textContent||'');if(t.includes('$'))e.textContent=roundMoneyText(t);else if(/%$/.test(t)){const n=parseFloat(t);if(Number.isFinite(n))e.textContent=Math.round(n)+'%'}})}catch(e){}}f.addEventListener('load',()=>setTimeout(apply,200));setInterval(apply,400)})();</script></body></html>

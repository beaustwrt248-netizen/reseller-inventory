<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171126"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Beau's Reseller Hub Update</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171126;color:#fff;font-family:system-ui,sans-serif}.box{width:min(520px,calc(100% - 32px));padding:28px;border-radius:24px;background:#21183a;border:1px solid #3a3154;text-align:center;box-shadow:0 15px 40px #0006}button{padding:12px 18px;border:0;border-radius:12px;background:#7657ff;color:#fff;font-weight:800}</style></head><body><div class="box"><div style="font-size:42px">🔄</div><h1>Beau's Reseller Hub</h1><p id="msg">Preparing the latest stable version…</p><button id="open" type="button">Open Latest Version</button></div><script>(async()=>{const b=Date.now(),btn=document.getElementById('open'),msg=document.getElementById('msg');async function clearOldCaches(){try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(e){console.warn('Cache cleanup skipped',e)}}async function openLatest(){btn.disabled=true;msg.textContent='Opening the latest stable version…';try{await clearOldCaches()}finally{location.replace('./index.html?ota='+Date.now()+'#dashboard')}}btn.onclick=openLatest;try{const r=await fetch('./update.json?ts='+b,{cache:'no-store',headers:{'Cache-Control':'no-cache'}}),d=await r.json();msg.textContent='Stable version '+(d.version||'latest')+' is ready. Updating the web files…'}catch{msg.textContent='The update manifest could not be checked, but the latest web app can still be opened.'}setTimeout(openLatest,900)})();</script></body></html>

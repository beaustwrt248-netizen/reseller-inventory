<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Updating Beau's Game Inventory…</title></head>
<body style="font-family:Arial,sans-serif;background:#111827;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0"><div style="text-align:center;padding:24px"><div style="font-size:42px">🔄</div><h2>Loading latest version…</h2><p id="msg">Refreshing the app.</p><button id="retry" style="display:none;border:0;border-radius:10px;padding:12px 18px;font-weight:700">Retry</button></div>
<script>
(function(){
  const stamp=Date.now();
  const hash=location.hash||localStorage.getItem('beauLastScreenHash')||'#dashboard';
  const target='./index.html?ota='+stamp+'&build=2.4.0'+hash;
  let done=false;
  function go(){if(done)return;done=true;window.location.replace(target)}
  document.getElementById('msg').textContent='Starting the latest app…';
  setTimeout(go,150);
  setTimeout(function(){if(done)return;document.getElementById('msg').textContent='The update is taking longer than expected.';document.getElementById('retry').style.display='inline-block'},6000);
  document.getElementById('retry').onclick=go;
})();
</script></body></html>

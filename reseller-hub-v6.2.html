<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><title>Beau's Reseller Hub v6.2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f6f7fb}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="Beau's Reseller Hub" src="./reseller-hub-v6.html?v=6.2.0"></iframe><script>(function(){const frame=document.getElementById('app');function enhance(){let w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;try{const priceSection=d.getElementById('pricing');if(priceSection&&!priceSection.dataset.v62){priceSection.dataset.v62='1';const stats=priceSection.querySelector('.stats');if(stats){const first=stats.children[0];const second=stats.children[1];if(first){first.querySelector('span').textContent='25% RECOMMENDED BUY ⭐';first.style.border='2px solid #6d5dfc';first.style.background='#f0efff'}if(second)second.querySelector('span').textContent='PROFIT AT 25% BUY'}const note=d.createElement('div');note.textContent='Game buying rule: target 21–30% of expected resale. 25% is the recommended target.';note.style='margin:14px 0;padding:12px 14px;border-radius:14px;background:#eef0f5;color:#182033;font-size:14px;font-weight:700';priceSection.querySelector('.card')?.appendChild(note)}const label=d.querySelector('#pricing label');if(label)label.firstChild.textContent='Expected resale value';const costLabel=Array.from(d.querySelectorAll('#pricing label')).find(x=>x.textContent.includes('Cost'));if(costLabel)costLabel.firstChild.textContent='Your actual cost';const pBuy=d.getElementById('pBuy'),pSell=d.getElementById('pSell'),pCost=d.getElementById('pCost'),pProfit=d.getElementById('pProfit');function calc(){const resale=Number(pSell?.value||0),cost=Number(pCost?.value||0);const buy=resale*.25;const profit=buy-cost;if(pBuy)pBuy.textContent='$'+buy.toFixed(2);if(pProfit)pProfit.textContent='$'+profit.toFixed(2)}if(pSell&&!pSell.dataset.v62){pSell.dataset.v62='1';pSell.addEventListener('input',calc);pCost.addEventListener('input',calc);calc()}const oldLookup=w.lookup;if(typeof oldLookup==='function'&&!oldLookup.__v62){const wrapped=async function(code){await oldLookup(code);const result=d.getElementById('scanResult');if(!result)return;const strongs=Array.from(result.querySelectorAll('strong'));const resaleText=strongs.find(x=>/^\$\d+\.\d+$/.test(x.textContent.trim()));if(!resaleText)return;const resale=Number(resaleText.textContent.replace('$',''));const cards=d.querySelectorAll('.buycard');if(cards.length<3){const grid=d.createElement('div');grid.className='buygrid';grid.style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px';[['21% Conservative Buy',.21,false],['25% Recommended Buy ⭐',.25,true],['30% Maximum Buy',.30,false]].forEach(([label,pct,featured])=>{const c=d.createElement('div');c.style='padding:14px;border-radius:16px;background:'+(featured?'#f0efff':'#f6f7fb')+';border:'+(featured?'2px solid #6d5dfc':'1px solid #e7e9f0');c.innerHTML='<span style="display:block;color:#6b7280;font-size:12px;font-weight:800">'+label+'</span><strong style="display:block;font-size:24px;margin-top:6px">$'+(resale*pct).toFixed(2)+'</strong>';grid.appendChild(c)});result.appendChild(grid)}else{cards[0].querySelector('strong').textContent='$'+(resale*.21).toFixed(2);cards[1].querySelector('strong').textContent='$'+(resale*.25).toFixed(2);cards[2].querySelector('strong').textContent='$'+(resale*.30).toFixed(2)}};wrapped.__v62=true;w.lookup=wrapped}}catch(e){console.warn('v6.2 enhancement',e)}}frame.addEventListener('load',()=>setTimeout(enhance,250));setInterval(enhance,1000)})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><title>Beau's Reseller Hub — Scanner v4.2</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="./pricing-engine.js?v=3.3.0"></script><style>body{margin:0;background:#f6f7fb;color:#182033;font-family:system-ui,Arial,sans-serif;padding-bottom:82px}header{background:linear-gradient(135deg,#6d5dfc,#998cff);color:#fff;padding:20px 16px}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e7e9f0;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px #1820330a}#reader{min-height:260px;background:#0e1020;border-radius:18px;overflow:hidden}#reader video{width:100%!important;min-height:260px;object-fit:cover}.status{margin-top:12px;padding:12px;border-radius:12px;background:#f1f3f8;color:#6b7280}.ok{background:#e8fbf2;color:#147b59}.bad{background:#fff0f2;color:#a62b3e}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{flex:1;border:0;border-radius:13px;padding:14px;font-weight:800;cursor:pointer}.primary{background:#6d5dfc;color:#fff}.secondary{background:#eef0f5;color:#182033}.buygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.buy{padding:14px;border:1px solid #e7e9f0;border-radius:14px}.recommended{border:2px solid #6d5dfc;background:#f3f1ff}.buy span{display:block;font-size:12px;font-weight:800;color:#6b7280}.buy strong{font-size:24px;display:block;margin-top:5px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e7e9f0}.row:last-child{border-bottom:0}.note{margin-top:13px;padding:13px;border-radius:12px;background:#fafaff;border:1px solid #e7e9f0}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #e7e9f0;display:flex;z-index:9999}.nav a{flex:1;text-align:center;text-decoration:none;color:#6b7280;padding:9px 2px;font-size:11px;font-weight:800}.nav a.active{color:#6d5dfc;background:#f3f1ff}@media(max-width:500px){.buygrid{grid-template-columns:1fr}}</style></head><body><header><h1>📷 Game Scanner</h1><p>Identify a game and calculate what you should pay.</p></header><main><section class="card"><div id="reader"></div><div id="status" class="status">Scanner v4.2 ready.</div><div class="actions"><button id="start" class="primary">📷 Start Camera</button><button id="stop" class="secondary" disabled>⏹ Stop</button></div><input id="barcode" style="width:100%;margin-top:14px;padding:13px;border:1px solid #e7e9f0;border-radius:13px;font-size:17px" placeholder="Enter barcode manually…"><div class="actions"><button id="lookup" class="primary">🔎 Find Product & Pricing</button></div></section><section id="result" class="card" style="display:none"></section></main><nav class="nav"><a href="./index.html#dashboard?v=7.4.0">🏠<br>Home</a><a href="./index.html#inventory?v=7.4.0">📦<br>Stock</a><a class="active" href="./scanner-v4.2.html?v=4.2.0">📷<br>Scan</a><a href="./index.html#pricing?v=7.4.0">💰<br>Pricing</a><a href="./index.html#library?v=7.4.0">📚<br>Library</a><a href="./index.html#settings?v=7.4.0">⚙️<br>Settings</a></nav><script>'use strict';const $=x=>document.getElementById(x),money=x=>Number(x)>0?'$'+Math.round(Number(x)):'Not available';let scanner=null,running=false,busy=false;function setStatus(t,c=''){ $('status').textContent=t;$('status').className='status '+c }function stopTracks(){document.querySelectorAll('video').forEach(v=>v.srcObject?.getTracks().forEach(t=>t.stop()))}async function stop(){const s=scanner;scanner=null;running=false;if(s){try{await Promise.race([s.stop(),new Promise(r=>setTimeout(r,1000))])}catch(e){}try{s.clear()}catch(e){}}stopTracks();$('stop').disabled=true;$('start').disabled=false}async function start(){if(running)return;await stop();try{scanner=new Html5Qrcode('reader');const cfg={fps:10,qrbox:{width:280,height:160},aspectRatio:1.7778};try{await scanner.start({facingMode:'environment'},cfg,code=>lookup(code),()=>{})}catch(e){const cams=await Html5Qrcode.getCameras();if(!cams.length)throw e;await scanner.start(cams[0].id,cfg,code=>lookup(code),()=>{})}running=true;$('stop').disabled=false;setStatus('Camera ready — point at a game barcode.','ok')}catch(e){setStatus('Camera could not be started: '+(e.message||e),'bad')}}async function lookup(code){if(busy)return;code=String(code||'').trim();if(!code){setStatus('Enter a barcode first.','bad');return}busy=true;setStatus('Looking up product and pricing…');try{await stop();const q=await window.BeauPricingEngine.lookup(code);const x=window.BeauPricingEngine.normalise(q.data,q.barcode||code);if(!x||!x.title||x.title==='Unknown game')throw Error('No recognizable game was returned.');const resale=Math.round(Number(x.resale||x.second||0)),g=x.buyGuide||window.BeauPricingEngine.buyGuide(resale,'Used - Good');$('result').style.display='block';$('result').innerHTML='<h2>🎮 '+esc(x.title)+'</h2><div class="row"><span>Platform</span><b>'+esc(x.platform||'Unknown')+'</b></div><div class="row"><span>Barcode</span><b>'+esc(q.barcode||code)+'</b></div><div class="row"><span>Expected resale</span><b>'+money(resale)+'</b></div><div class="buygrid"><div class="buy"><span>21% Conservative</span><strong>'+money(g.conservative)+'</strong></div><div class="buy recommended"><span>25% Recommended ⭐</span><strong>'+money(g.recommended)+'</strong></div><div class="buy"><span>30% Maximum</span><strong>'+money(g.maximum)+'</strong></div></div><div class="note">Recommended target: 25% of expected resale. Values are rounded to whole dollars.</div><p>Source: '+esc(q.route||'Pricing engine')+'</p>';setStatus('Product found.','ok')}catch(e){$('result').style.display='block';$('result').innerHTML='<b>Barcode:</b> '+esc(code)+'<p>Lookup failed.</p><small>'+esc(e.message||e)+'</small>';setStatus('Lookup failed.','bad')}finally{busy=false}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('start').onclick=start;$('stop').onclick=stop;$('lookup').onclick=()=>lookup($('barcode').value);$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter')lookup(e.target.value)});window.addEventListener('pagehide',stop);</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5dfc"><title>Beau's Reseller Hub v8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./app-shell-v8.html?v=8.0.1" title="Beau's Reseller Hub"></iframe><script>(function(){const frame=document.getElementById('app');function patch(){let w,d;try{w=frame.contentWindow;d=w.document}catch(e){return}if(!d)return;w.show=function(page){d.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===page));d.querySelectorAll('.bottom button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));try{if(page==='dashboard'&&typeof w.renderDash==='function')w.renderDash();if(page==='inventory'&&typeof w.renderInv==='function')w.renderInv();if(page==='library'&&typeof w.renderLib==='function')w.renderLib();if(page==='settings'&&typeof w.renderAdmin==='function')w.renderAdmin()}catch(e){}try{w.history.replaceState(null,'','#'+page)}catch(e){}};d.querySelectorAll('.bottom button[data-page]').forEach(b=>{b.onclick=function(e){e.preventDefault();e.stopPropagation();w.show(b.dataset.page)}});const hash=(w.location.hash||'#dashboard').slice(1).split('?')[0];w.show(['dashboard','inventory','scanner','pricing','library','settings'].includes(hash)?hash:'dashboard')}frame.addEventListener('load',function(){setTimeout(patch,50);setTimeout(patch,500)});setInterval(patch,2000)})();</script></body></html>

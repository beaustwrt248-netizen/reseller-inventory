<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beau's Game Inventory — Smart Buy</title><link rel="stylesheet" href="./mobile-theme.css"><script src="./nav-safe-area.js"></script><script src="./smart-buy.js"></script><style>body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:80px}header{background:#111827;color:#fff;padding:18px 14px}.wrap{max-width:900px;margin:auto;padding:12px}.panel{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:14px}input{width:100%;padding:13px;margin-top:5px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:13px 16px;font-weight:bold;font-size:15px}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.result{margin-top:14px;padding:16px;border-radius:12px;background:#f9fafb;border:1px solid #e5e7eb}.rating{font-size:22px;font-weight:bold;margin-bottom:10px}.good{color:#15803d}.warning{color:#b45309}.bad{color:#dc2626}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.mobile-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#111827;display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:5px}.mobile-nav a{color:#fff;text-decoration:none;text-align:center;font-size:10px;font-weight:bold;padding:6px}.mobile-nav span{display:block;font-size:19px}@media(max-width:700px){.form{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><header><div class="wrap"><h1 style="margin:0">🧠 Smart Buy</h1><p style="margin:5px 0;opacity:.8">Know what to pay before you buy.</p></div></header><main class="wrap"><section class="panel"><h2>💰 Buy Decision</h2><div class="form"><label>Market / Resale Price ($)<input id="market" type="number" min="0" step="0.01" placeholder="e.g. 49.95"></label><label>Marketplace Fees ($)<input id="fees" type="number" min="0" step="0.01" value="0"></label><label>Shipping ($)<input id="shipping" type="number" min="0" step="0.01" value="0"></label><label>Target Profit Margin (%)<input id="margin" type="number" min="0" max="90" step="1" value="30"></label></div><div class="actions"><button class="primary" id="calculate">🧠 Calculate</button><button class="secondary" id="clear">Clear</button></div><div id="result" class="result"><div class="rating">Enter a market price to begin.</div></div></section><section class="panel"><h2>📷 Scan first</h2><p>Use the Scanner to identify a game, then bring the market price here to decide what you should pay.</p><div class="actions"><a class="primary" style="text-decoration:none;border-radius:9px;padding:13px 16px;font-weight:bold" href="./scanner.html">📷 Open Scanner</a><a class="secondary" style="text-decoration:none;border-radius:9px;padding:13px 16px;font-weight:bold" href="./pricing.html">💰 Pricing</a></div></section></main><nav class="mobile-nav"><a href="./dashboard.html"><span>📊</span>Dashboard</a><a href="./"><span>📦</span>Inventory</a><a href="./scanner.html"><span>📷</span>Scanner</a><a href="./pricing.html"><span>💰</span>Pricing</a><a href="./sales.html"><span>🧾</span>Sales</a></nav><script>const money=v=>'$'+Number(v||0).toFixed(2);function render(){const r=smartBuy(+market.value,+fees.value,+shipping.value,+margin.value);if(!r.resale){result.innerHTML='<div class="rating">Enter a market price to begin.</div>';return}result.innerHTML='<div class="rating '+r.cls+'">'+r.rating+'</div><div class="row"><span>Expected resale</span><strong>'+money(r.resale)+'</strong></div><div class="row"><span>Maximum buy price</span><strong>'+money(r.maxBuy)+'</strong></div><div class="row"><span>Expected profit</span><strong class="'+(r.profit>=0?'good':'bad')+'">'+money(r.profit)+'</strong></div><div class="row"><span>Margin</span><strong>'+r.margin.toFixed(1)+'%</strong></div>'}calculate.onclick=render;[market,fees,shipping,margin].forEach(x=>x.addEventListener('input',render));clear.onclick=()=>{market.value='';fees.value=0;shipping.value=0;margin.value=30;render()};</script></body></html>

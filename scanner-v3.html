<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5dfc"><title>Beau's Game Inventory — Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="./pricing-engine.js?v=3.2.0"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182033;font-family:Inter,Arial,sans-serif;padding-bottom:82px}header{background:linear-gradient(135deg,#6d5dfc,#998cff);color:#fff;padding:20px 16px}header h1{margin:0;font-size:24px}header p{margin:7px 0;opacity:.9}.wrap{max-width:760px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid #e7e9f0;border-radius:20px;padding:17px;box-shadow:0 5px 18px #1820330a;margin-bottom:14px}#reader{width:100%;min-height:260px;background:#0e1020;border-radius:18px;overflow:hidden}#reader video{width:100%!important;min-height:260px;object-fit:cover}.status{margin-top:12px;padding:12px;border-radius:12px;background:#f1f3f8;color:#6b7280}.ok{background:#e8fbf2;color:#147b59}.bad{background:#fff0f2;color:#a62b3e}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{flex:1;padding:14px;border:0;border-radius:13px;font-size:16px;font-weight:800;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.45}.primary{background:#6d5dfc;color:#fff}.secondary{background:#eef0f5;color:#182033}.success{background:#18a875;color:#fff}.manual{margin-top:18px}.manual label,label{display:block;font-weight:800;font-size:13px}.manual input,input,select{width:100%;margin-top:6px;padding:13px;border:1px solid #e7e9f0;border-radius:13px;font-size:17px;background:#fff;color:#182033}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.buyGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.buyBox{border:1px solid #e7e9f0;border-radius:14px;padding:14px;background:#fbfbfe}.buyBox span{display:block;font-size:12px;color:#6b7280;font-weight:800}.buyBox strong{font-size:24px;display:block;margin-top:4px}.recommended{border:2px solid #6d5dfc;background:#f3f1ff}.recommended strong{color:#5c4df1}.note{padding:13px;border-radius:12px;background:#fafaff;border:1px solid #e7e9f0;margin-top:13px}.notice{padding:12px;border-radius:12px;background:#e8fbf2;color:#147b59;margin-top:12px}.version{font-size:12px;opacity:.6;margin-top:12px}.hidden{display:none}.nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;height:72px!important;background:#fff!important;color:#374151!important;display:flex!important;z-index:2147483647!important;border-top:1px solid #e7e9f0!important;box-shadow:0 -8px 25px #1820330c!important;pointer-events:auto!important}.nav button{appearance:none!important;background:#fff!important;color:#6b7280!important;border:0!important;box-shadow:none!important;font-size:11px!important;padding:6px 2px!important;flex:1!important;min-width:0!important;height:72px!important;border-radius:0!important}.nav button.active{background:#f3f1ff!important;color:#6d5dfc!important}@media(max-width:480px){.grid,.buyGrid{grid-template-columns:1fr}}</style></head><body><header><h1>📷 Beau's Game Inventory</h1><p>Scan a game, see the market value and decide what to pay.</p></header><div class="wrap"><section class="panel"><div id="reader"></div><div id="status" class="status">Scanner v4.1 is ready. Tap Start Camera.</div><div class="actions"><button id="start" class="primary">📷 Start Camera</button><button id="stop" class="secondary" disabled>⏹ Stop Camera</button></div><div class="manual"><label for="barcode">⌨️ Barcode</label><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Enter barcode…" maxlength="32"></div><div class="actions"><button id="lookup" class="primary">🔎 Find Product & Pricing</button></div></section><section id="productPanel" class="panel hidden"></section><section id="addPanel" class="panel hidden"><h2>📦 Add to Inventory</h2><div class="grid"><div><label>Your Buy Cost ($)</label><input id="buyCost" type="number" min="0" step="0.01" placeholder="What you actually paid"></div><div><label>Quantity</label><input id="qty" type="number" min="1" value="1"></div><div><label>Condition</label><select id="condition"><option>New</option><option>Like New</option><option>Used - Good</option><option>Used - Fair</option><option>For Parts</option></select></div><div><label>Selling Price ($)</label><input id="sellPrice" type="number" min="0" step="0.01"></div></div><div class="actions"><button id="add" class="success">📦 Add to Inventory</button><button id="skip" class="secondary">Skip</button></div><div id="addStatus"></div></section><section id="nextPanel" class="panel hidden"><h3>Ready for another game?</h3><button id="next" class="primary">📷 Scan Another Game</button></section><div class="version">Scanner build v4.1</div></div><nav class="nav"><button type="button" onclick="location.href='./index.html#dashboard?v=4.1.0'">🏠<br>Home</button><button type="button" onclick="location.href='./index.html#inventory?v=4.1.0'">📦<br>Stock</button><button type="button" class="active">📷<br>Scan</button><button type="button" onclick="location.href='./index.html#pricing?v=4.1.0'">💰<br>Pricing</button><button type="button" onclick="location.href='./index.html#library?v=4.1.0'">📚<br>Library</button><button type="button" onclick="location.href='./index.html#settings?v=4.1.0'">⚙️<br>Settings</button></nav><script>'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available',buyMoney=v=>'$'+Math.round(Number(v||0));let scanner=null,running=false,busy=false,current=null;function status(t,k=''){$('status').textContent=t;$('status').className='status '+k}function stopTracks(){document.querySelectorAll('video').forEach(v=>{try{v.srcObject?.getTracks().forEach(t=>t.stop())}catch(e){}})}async function stopCamera(){const s=scanner;scanner=null;running=false;if(s){try{await Promise.race([s.stop(),new Promise(r=>setTimeout(r,1200))])}catch(e){}try{s.clear()}catch(e){}}stopTracks();$('stop').disabled=true;$('start').disabled=false}async function startCamera(){if(running)return;await stopCamera();if(!window.Html5Qrcode){status('Scanner library failed to load.','bad');return}try{status('Requesting camera access…');if(navigator.mediaDevices?.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});st.getTracks().forEach(t=>t.stop())}scanner=new Html5Qrcode('reader');const cfg={fps:10,qrbox:{width:280,height:160},aspectRatio:1.7778,disableFlip:false};try{await scanner.start({facingMode:'environment'},cfg,scanSuccess,()=>{})}catch(e){const cams=await Html5Qrcode.getCameras();if(!cams.length)throw e;const rear=cams.find(c=>/back|rear|environment|world/i.test(c.label||''))||cams[0];await scanner.start(rear.id,cfg,scanSuccess,()=>{})}running=true;$('stop').disabled=false;status('Camera ready — point at a game barcode.','ok')}catch(e){await stopCamera();status('Camera could not be started: '+(e?.message||e),'bad')}}function scanSuccess(code){if(!running||busy)return;const c=String(code||'').trim();if(c)lookupBarcode(c)}function localProduct(code){const c=String(code).replace(/\D/g,'');return {'5030917298462':{title:'Diablo IV',platform:'PlayStation 5',retail:88,second:66,resale:66,source:'Australian barcode catalog'}}[c]||null}async function lookupBarcode(code){if(busy)return;code=String(code||'').trim();if(!/^[0-9A-Za-z-]{4,32}$/.test(code)){status('Please enter a valid barcode.','bad');return}busy=true;$('lookup').disabled=true;$('lookup').textContent='⏳ Looking up…';status('Checking product and pricing…');try{await stopCamera();let q=null,x=localProduct(code),source='Australian barcode catalog';if(!x&&window.BeauPricingEngine?.lookup){q=await Promise.race([window.BeauPricingEngine.lookup(code),new Promise((_,r)=>setTimeout(()=>r(Error('Pricing service timed out')),9000))]);x=window.BeauPricingEngine.normalise(q.data,q.barcode||code);source=q.route||'Pricing engine'}if(!x||!x.title||/^generic|game$|product$|item$/i.test(String(x.title).trim()))throw Error('No usable product title was returned. The pricing service responded, but did not provide a recognizable game.');current={...x,barcode:code};showProduct(current,source);saveLibrary(current);prepareAdd(current);status('Product found.','ok')}catch(e){status('Lookup failed — '+(e?.message||'Unknown error'),'bad');$('productPanel').classList.remove('hidden');$('productPanel').innerHTML='<div><b>Barcode:</b> '+esc(code)+'<p>The pricing service did not return a recognizable game.</p><small>Details: '+esc(e?.message||'Unknown error')+'</small></div>'}finally{busy=false;$('lookup').disabled=false;$('lookup').textContent='🔎 Find Product & Pricing'}}function showProduct(x,source){const resale=Number(x.resale||x.second||0);const guide=x.buyGuide||window.BeauPricingEngine?.buyGuide?.(resale)||{conservative:resale*.21,recommended:resale*.25,maximum:resale*.30};$('productPanel').classList.remove('hidden');$('productPanel').innerHTML='<h2>🎮 '+esc(x.title)+'</h2>'+(x.platform?'<div class="row"><span>Platform</span><b>'+esc(x.platform)+'</b></div>':'')+'<div class="row"><span>Barcode</span><b>'+esc(x.barcode)+'</b></div><div class="row"><span>New / RRP</span><b>'+money(x.retail)+'</b></div><div class="row"><span>Expected resale</span><b>'+money(resale)+'</b></div><div class="buyGrid"><div class="buyBox"><span>21% — Conservative</span><strong>'+buyMoney(guide.conservative)+'</strong></div><div class="buyBox recommended"><span>25% — Recommended</span><strong>'+buyMoney(guide.recommended)+'</strong></div><div class="buyBox"><span>30% — Maximum</span><strong>'+buyMoney(guide.maximum)+'</strong></div></div><div class="note">⭐ Recommended buy is 25% of expected resale. Maximum buy is 30%.</div><p>Pricing source: '+esc(source)+'</p>'}function prepareAdd(x){$('addPanel').classList.remove('hidden');$('buyCost').value='';$('qty').value='1';$('condition').value='Used - Good';$('sellPrice').value=Math.round(Number(x.resale||x.second||x.retail||0))||'';$('addStatus').innerHTML='';$('nextPanel').classList.remove('hidden')}function saveLibrary(x){try{let a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]');if(!Array.isArray(a))a=[];const i=a.findIndex(v=>String(v.barcode)===String(x.barcode));const item={...x,checkedAt:new Date().toISOString()};if(i>=0)a[i]={...a[i],...item};else a.unshift(item);localStorage.setItem('beauGameLibrary',JSON.stringify(a.slice(0,500)))}catch(e){}}function addInventory(){if(!current)return;const cost=Number($('buyCost').value||0),qty=Math.max(1,Number($('qty').value||1)),sell=Number($('sellPrice').value||0);if(cost<=0){$('addStatus').innerHTML='<div class="status bad">Enter what you paid before adding the item.</div>';return}let inv=[];try{inv=JSON.parse(localStorage.getItem('resellerInventory')||'[]');if(!Array.isArray(inv))inv=[]}catch(e){inv=[]}const resale=Number(current.resale||current.second||0),guide=current.buyGuide||window.BeauPricingEngine?.buyGuide?.(resale)||{conservative:resale*.21,recommended:resale*.25,maximum:resale*.30};const barcode=String(current.barcode||'');let item=inv.find(i=>String(i.barcode||'')===barcode);if(item){item.quantity=Number(item.quantity||0)+qty;item.cost=cost;item.rrp=Math.round(Number(current.retail||item.rrp||0));item.marketPrice=Math.round(resale||item.marketPrice||0);item.selling=Math.round(sell||item.marketPrice);item.condition=$('condition').value;item.platform=current.platform||item.platform||'Other';item.name=current.title||item.name;item.buyGuide=guide}else{item={id:Date.now(),dateAdded:new Date().toISOString(),name:current.title||'Game',barcode,category:'Game',platform:current.platform||'Other',condition:$('condition').value,quantity:qty,cost,rrp:Math.round(Number(current.retail||0)),marketPrice:Math.round(resale),selling:Math.round(sell||resale),priceSource:'Scanner v4.1',priceChecked:new Date().toISOString(),buyGuide:guide,sales:[]};inv.push(item)}localStorage.setItem('resellerInventory',JSON.stringify(inv));$('addStatus').innerHTML='<div class="notice">✅ '+esc(item.name)+' added to inventory. Recommended buy: '+buyMoney(guide.recommended)+' · Maximum: '+buyMoney(guide.maximum)+'</div>';$('add').disabled=true}function nextScan(){current=null;$('productPanel').classList.add('hidden');$('addPanel').classList.add('hidden');$('nextPanel').classList.add('hidden');$('barcode').value='';$('add').disabled=false;status('Ready for another scan.','ok');startCamera()}$('start').onclick=startCamera;$('stop').onclick=stopCamera;$('lookup').onclick=()=>lookupBarcode($('barcode').value);$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookupBarcode(e.target.value)}});$('add').onclick=addInventory;$('skip').onclick=()=>{$('addPanel').classList.add('hidden')};$('next').onclick=nextScan;window.addEventListener('pagehide',stopCamera);</script></body></html>

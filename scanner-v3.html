<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1877f2"><title>Beau's Game Inventory — Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="./pricing-engine.js?v=3.2.0"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:82px}header{background:#1877f2;color:#fff;padding:18px 16px}header h1{margin:0;font-size:23px}header p{margin:7px 0}.wrap{max-width:700px;margin:auto;padding:14px}.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px #0002;margin-bottom:14px}#reader{width:100%;min-height:250px;background:#000;border-radius:14px;overflow:hidden}#reader video{width:100%!important;min-height:250px;object-fit:cover}.status{margin-top:12px;padding:12px;border-radius:10px;background:#eef2f7}.ok{background:#166534;color:#fff}.bad{background:#9a3412;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;touch-action:manipulation}button:disabled{opacity:.45}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.success{background:#16a34a;color:#fff}.manual{margin-top:18px}.manual label,label{display:block;font-weight:700}.manual input,input,select{width:100%;margin-top:6px;padding:13px;border:2px solid #d1d5db;border-radius:12px;font-size:17px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin-top:16px;padding:16px;border-radius:16px;background:#f8fafc}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.price{font-size:24px;font-weight:800}.notice{padding:12px;border-radius:10px;background:#ecfdf5;margin-top:12px}.version{font-size:12px;opacity:.65;margin-top:12px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#111827;display:flex;z-index:10}.nav button{background:transparent;color:#fff;font-size:11px;padding:6px 2px;flex:1}.hidden{display:none}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>📷 Beau's Game Inventory</h1><p>Scan a game barcode or enter it manually.</p></header><div class="wrap"><section class="panel"><div id="reader"></div><div id="status" class="status">Scanner v3.2 is ready. Tap Start Camera.</div><div class="actions"><button id="start" class="primary">📷 Start Camera</button><button id="stop" class="secondary" disabled>⏹ Stop Camera</button></div><div class="manual"><label for="barcode">⌨️ Barcode</label><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Enter barcode…" maxlength="32"></div><div class="actions"><button id="lookup" class="primary">🔎 Find Product & Pricing</button></div></section><section id="productPanel" class="panel hidden"></section><section id="addPanel" class="panel hidden"><h2>📦 Add to Inventory</h2><div class="grid"><div><label>Buy Cost ($)</label><input id="buyCost" type="number" min="0" step="0.01" placeholder="What you paid"></div><div><label>Quantity</label><input id="qty" type="number" min="1" value="1"></div><div><label>Condition</label><select id="condition"><option>New</option><option>Like New</option><option>Used - Good</option><option>Used - Fair</option><option>For Parts</option></select></div><div><label>Selling Price ($)</label><input id="sellPrice" type="number" min="0" step="0.01"></div></div><div class="actions"><button id="add" class="success">📦 Add to Inventory</button><button id="skip" class="secondary">Skip</button></div><div id="addStatus"></div></section><section id="nextPanel" class="panel hidden"><h3>Ready for another game?</h3><button id="next" class="primary">📷 Scan Another Game</button></section><div class="version">Scanner build v3.2.0</div></div><nav class="nav"><button onclick="location.href='index.html#dashboard'">📊<br>Dashboard</button><button onclick="location.href='index.html#inventory'">📦<br>Inventory</button><button>📷<br>Scanner</button><button onclick="location.href='index.html#pricing'">💰<br>Pricing</button><button onclick="location.href='library.html'">📚<br>Library</button></nav><script>
'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';let scanner=null,running=false,busy=false,current=null;
function status(t,k=''){ $('status').textContent=t;$('status').className='status '+k }
function stopTracks(){document.querySelectorAll('video').forEach(v=>{try{v.srcObject?.getTracks().forEach(t=>t.stop())}catch(e){}})}
async function stopCamera(){const s=scanner;scanner=null;running=false;if(s){try{await Promise.race([s.stop(),new Promise(r=>setTimeout(r,1200))])}catch(e){}try{s.clear()}catch(e){}}stopTracks();$('stop').disabled=true;$('start').disabled=false}
async function startCamera(){if(running)return;await stopCamera();if(!window.Html5Qrcode){status('Scanner library failed to load.','bad');return}try{status('Requesting camera access…');if(navigator.mediaDevices?.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});st.getTracks().forEach(t=>t.stop())}scanner=new Html5Qrcode('reader');const cfg={fps:10,qrbox:{width:280,height:160},aspectRatio:1.7778,disableFlip:false};try{await scanner.start({facingMode:'environment'},cfg,scanSuccess,()=>{})}catch(e){const cams=await Html5Qrcode.getCameras();if(!cams.length)throw e;const rear=cams.find(c=>/back|rear|environment|world/i.test(c.label||''))||cams[0];await scanner.start(rear.id,cfg,scanSuccess,()=>{})}running=true;$('stop').disabled=false;status('Camera ready — point at a game barcode.','ok')}catch(e){await stopCamera();status('Camera could not be started: '+(e?.message||e),'bad')}}
function scanSuccess(code){if(!running||busy)return;const c=String(code||'').trim();if(c)lookupBarcode(c)}
function localProduct(code){const c=String(code).replace(/\D/g,'');return {'5030917298462':{title:'Diablo IV',platform:'PlayStation 5',retail:88,second:66,resale:66,buy:46.2,source:'Australian barcode catalog'}}[c]||null}
async function lookupBarcode(code){if(busy)return;code=String(code||'').trim();if(!/^[0-9A-Za-z-]{4,32}$/.test(code)){status('Please enter a valid barcode.','bad');return}busy=true;$('lookup').disabled=true;$('lookup').textContent='⏳ Looking up…';status('Checking product and pricing…');try{await stopCamera();let x=localProduct(code),source='Australian barcode catalog';if(!x&&window.BeauPricingEngine?.lookup){const q=await Promise.race([window.BeauPricingEngine.lookup(code),new Promise((_,r)=>setTimeout(()=>r(Error('Pricing service timed out')),9000))]);x=window.BeauPricingEngine.normalise(q.data,q.barcode||code);source=q.route||'Pricing engine'}if(!x||/^game$/i.test(x.title||''))throw Error('No usable game product was returned for this barcode.');current={...x,barcode:code};showProduct(current,source);saveLibrary(current);prepareAdd(current);status('Product found.','ok')}catch(e){status('Lookup failed — '+(e?.message||'Unknown error'),'bad');$('productPanel').classList.remove('hidden');$('productPanel').innerHTML='<div class="card"><b>Barcode:</b> '+esc(code)+'<p>No usable product record was returned.</p><small>'+esc(e?.message||'Unknown error')+'</small></div>'}finally{busy=false;$('lookup').disabled=false;$('lookup').textContent='🔎 Find Product & Pricing'}}
function showProduct(x,source){const resale=Number(x.resale||x.second||0),buy=Number(x.buy||resale*.7||0);$('productPanel').classList.remove('hidden');$('productPanel').innerHTML='<h2>🎮 '+esc(x.title)+'</h2>'+(x.platform?'<div class="row"><span>Platform</span><b>'+esc(x.platform)+'</b></div>':'')+'<div class="row"><span>Barcode</span><b>'+esc(x.barcode)+'</b></div><div class="row"><span>New / RRP</span><b>'+money(x.retail)+'</b></div><div class="row"><span>Second-hand</span><b>'+money(resale)+'</b></div><div class="row"><span>Suggested max buy</span><b class="price">'+money(buy)+'</b></div><div class="row"><span>Potential profit</span><b>'+money(resale-buy)+'</b></div><p>Pricing source: '+esc(source)+'</p>'}
function prepareAdd(x){$('addPanel').classList.remove('hidden');$('buyCost').value='';$('qty').value='1';$('condition').value='Used - Good';$('sellPrice').value=Number(x.resale||x.second||x.retail||0)||'';$('addStatus').innerHTML='';$('nextPanel').classList.remove('hidden')}
function saveLibrary(x){try{let a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]');if(!Array.isArray(a))a=[];const i=a.findIndex(v=>String(v.barcode)===String(x.barcode));const item={...x,checkedAt:new Date().toISOString()};if(i>=0)a[i]={...a[i],...item};else a.unshift(item);localStorage.setItem('beauGameLibrary',JSON.stringify(a.slice(0,500)))}catch(e){}}
function addInventory(){if(!current)return;const cost=Number($('buyCost').value||0),qty=Math.max(1,Number($('qty').value||1)),sell=Number($('sellPrice').value||0);if(cost<=0){$('addStatus').innerHTML='<div class="status bad">Enter what you paid before adding the item.</div>';return}let inv=[];try{inv=JSON.parse(localStorage.getItem('resellerInventory')||'[]');if(!Array.isArray(inv))inv=[]}catch(e){inv=[]}const barcode=String(current.barcode||'');let item=inv.find(i=>String(i.barcode||'')===barcode);if(item){item.quantity=Number(item.quantity||0)+qty;item.cost=cost;item.rrp=Number(current.retail||item.rrp||0);item.marketPrice=Number(current.resale||current.second||item.marketPrice||0);item.selling=sell||item.marketPrice;item.condition=$('condition').value;item.platform=current.platform||item.platform||'Other';item.name=current.title||item.name}else{item={id:Date.now(),dateAdded:new Date().toISOString(),name:current.title||'Game',barcode,category:'Game',platform:current.platform||'Other',condition:$('condition').value,quantity:qty,cost,rrp:Number(current.retail||0),marketPrice:Number(current.resale||current.second||0),selling:sell||Number(current.resale||current.second||0),priceSource:'Scanner v3.2',priceChecked:new Date().toISOString(),sales:[]};inv.push(item)}localStorage.setItem('resellerInventory',JSON.stringify(inv));$('addStatus').innerHTML='<div class="notice">✅ '+esc(item.name)+' added to inventory. Quantity: '+item.quantity+'</div>';$('add').disabled=true}
function nextScan(){current=null;$('productPanel').classList.add('hidden');$('addPanel').classList.add('hidden');$('nextPanel').classList.add('hidden');$('result')?.remove();$('barcode').value='';$('add').disabled=false;status('Ready for another scan.','ok');startCamera()}
$('start').onclick=startCamera;$('stop').onclick=stopCamera;$('lookup').onclick=()=>lookupBarcode($('barcode').value);$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookupBarcode(e.target.value)}});$('add').onclick=addInventory;$('skip').onclick=()=>{$('addPanel').classList.add('hidden')};$('next').onclick=nextScan;window.addEventListener('pagehide',stopCamera);
</script></body></html>

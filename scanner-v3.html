<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<title>Beau's Game Inventory — Scanner v3</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="./pricing-engine.js?v=3.0.0"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif;padding-bottom:90px}header{background:#1877f2;color:#fff;padding:18px 16px}header h1{margin:0;font-size:22px}header p{margin:7px 0 0}.wrap{max-width:700px;margin:auto;padding:14px}.panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px #0002}#reader{width:100%;min-height:260px;background:#000;border-radius:14px;overflow:hidden}#reader video{width:100%!important;min-height:260px;object-fit:cover}.status{margin-top:12px;padding:12px;border-radius:10px;background:#eef2f7}.ok{background:#166534;color:#fff}.bad{background:#9a3412;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{flex:1;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;touch-action:manipulation}.primary{background:#1877f2;color:#fff}.secondary{background:#e5e7eb;color:#111827}.manual{margin-top:18px}.manual label{display:block;font-weight:700}.manual input{width:100%;margin-top:6px;padding:14px;border:2px solid #d1d5db;border-radius:12px;font-size:18px}.card{margin-top:16px;padding:16px;border-radius:16px;background:#f8fafc}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.price{font-size:24px;font-weight:800}.version{font-size:12px;opacity:.7;margin-top:12px}.nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#111827;display:flex;z-index:10}.nav button{background:transparent;color:#fff;font-size:11px;padding:6px 2px}.nav button{flex:1}
</style>
</head>
<body>
<header><h1>📷 Beau's Game Inventory</h1><p>Scan a game barcode or enter it manually.</p></header>
<div class="wrap"><section class="panel">
<div id="reader"></div>
<div id="status" class="status">Scanner v3 is ready. Tap Start Camera.</div>
<div class="actions"><button id="start" class="primary" type="button">📷 Start Camera</button><button id="stop" class="secondary" type="button" disabled>⏹ Stop Camera</button></div>
<div class="manual"><label for="barcode">⌨️ Barcode</label><input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Enter barcode…" maxlength="32"></div>
<div class="actions"><button id="lookup" class="primary" type="button">🔎 Find Product & Pricing</button></div>
<div id="result"></div>
<div class="version">Scanner build v3.0.0</div>
</section></div>
<nav class="nav"><button onclick="location.href='index.html#dashboard'">📊<br>Dashboard</button><button onclick="location.href='index.html#inventory'">📦<br>Inventory</button><button>📷<br>Scanner</button><button onclick="location.href='index.html#pricing'">💰<br>Pricing</button><button onclick="location.href='library.html'">📚<br>Library</button></nav>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v)>0?'$'+Number(v).toFixed(2):'Not available';
let scanner=null,running=false,lookupBusy=false;
function setStatus(text,kind=''){ $('status').textContent=text;$('status').className='status '+kind }
function stopTracks(){document.querySelectorAll('video').forEach(v=>{try{v.srcObject?.getTracks().forEach(t=>t.stop())}catch(e){}})}
async function stopCamera(){const s=scanner;scanner=null;running=false;if(s){try{await Promise.race([s.stop(),new Promise(r=>setTimeout(r,1200))])}catch(e){}try{s.clear()}catch(e){}}stopTracks();$('stop').disabled=true;$('start').disabled=false}
async function startCamera(){if(running)return;await stopCamera();if(!window.Html5Qrcode){setStatus('Scanner library did not load. Refresh while connected to the internet.','bad');return}try{setStatus('Requesting camera access…');if(navigator.mediaDevices?.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});st.getTracks().forEach(t=>t.stop())}scanner=new Html5Qrcode('reader');const cfg={fps:10,qrbox:{width:280,height:160},aspectRatio:1.7778,disableFlip:false};try{await scanner.start({facingMode:'environment'},cfg,scanSuccess,()=>{})}catch(e){const cams=await Html5Qrcode.getCameras();if(!cams.length)throw e;const rear=cams.find(c=>/back|rear|environment|world/i.test(c.label||''))||cams[0];await scanner.start(rear.id,cfg,scanSuccess,()=>{})}running=true;$('stop').disabled=false;$('start').disabled=false;setStatus('Camera ready — point the rear camera at a game barcode.','ok')}catch(e){await stopCamera();setStatus('Camera could not be started: '+(e?.message||e),'bad')}}
function scanSuccess(code){if(!running||lookupBusy)return;const c=String(code||'').trim();if(!c)return;running=false;lookupBarcode(c)}
function localProduct(code){const c=String(code||'').replace(/\D/g,'');const catalog={'5030917298462':{title:'Diablo IV',platform:'PlayStation 5',retail:88,second:66,resale:66,buy:46.2,source:'Australian barcode catalog'}};return catalog[c]||null}
async function lookupBarcode(code){if(lookupBusy)return;code=String(code||'').trim();if(!/^[0-9A-Za-z-]{4,32}$/.test(code)){setStatus('Please enter a valid barcode.','bad');return}lookupBusy=true;$('lookup').disabled=true;$('lookup').textContent='⏳ Looking up…';setStatus('Checking product and pricing…');try{await stopCamera();let x=localProduct(code);let source='Local game catalog';if(!x&&window.BeauPricingEngine?.lookup){const q=await Promise.race([window.BeauPricingEngine.lookup(code),new Promise((_,rej)=>setTimeout(()=>rej(Error('Pricing service timed out')),9000))]);x=window.BeauPricingEngine.normalise(q.data,q.barcode||code);source=q.route||'Pricing engine'}if(!x)throw Error('No product match was returned for this barcode.');if(/^game$/i.test(x.title||''))throw Error('The lookup returned a generic product instead of a game.');$('barcode').value=x.barcode||code;showResult(x,source);saveLibrary(x)}catch(e){setStatus('Lookup failed — '+(e?.message||'Unknown error'),'bad');$('result').innerHTML='<div class="card"><b>Barcode:</b> '+esc(code)+'<br><br>The barcode was read successfully, but no usable product record was returned.<br><small>'+esc(e?.message||'Unknown error')+'</small></div>'}finally{lookupBusy=false;$('lookup').disabled=false;$('lookup').textContent='🔎 Find Product & Pricing'}}
function showResult(x,source){const resale=Number(x.resale||x.second||0),buy=Number(x.buy||resale*.7||0);$('result').innerHTML='<div class="card"><h2>'+esc(x.title||'Game')+'</h2>'+(x.platform?'<div class="row"><span>Platform</span><b>'+esc(x.platform)+'</b></div>':'')+'<div class="row"><span>Barcode</span><b>'+esc(x.barcode||$('barcode').value)+'</b></div><div class="row"><span>New / RRP</span><b>'+money(x.retail)+'</b></div><div class="row"><span>Second-hand</span><b>'+money(resale)+'</b></div><div class="row"><span>Suggested max buy</span><b class="price">'+money(buy)+'</b></div><div class="row"><span>Potential profit</span><b>'+money(resale-buy)+'</b></div><p>Pricing source: '+esc(source)+'</p><button class="primary" id="deal">View Deal Analyzer</button></div>';$('deal').onclick=()=>alert('Maximum buy: '+money(buy)+'\nSuggested resale: '+money(resale)+'\nPotential profit: '+money(resale-buy))}
function saveLibrary(x){try{let a=JSON.parse(localStorage.getItem('beauGameLibrary')||'[]');if(!Array.isArray(a))a=[];const item={...x,checkedAt:new Date().toISOString()};const i=a.findIndex(v=>String(v.barcode)===String(item.barcode));if(i>=0)a[i]={...a[i],...item};else a.unshift(item);localStorage.setItem('beauGameLibrary',JSON.stringify(a.slice(0,500)))}catch(e){}}
$('start').onclick=startCamera;$('stop').onclick=stopCamera;$('lookup').onclick=e=>{e.preventDefault();lookupBarcode($('barcode').value)};$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookupBarcode(e.target.value)}});window.addEventListener('pagehide',stopCamera);
</script>
</body></html>

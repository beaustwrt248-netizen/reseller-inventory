name: Validate Stable App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-app:
    name: Validate stable app files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate standalone app files
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          required = [
              'index.html', 'app.css', 'app.js', 'pricing-engine.js',
              'smart-buy.js', 'update.json', 'ota.html', 'package.json'
          ]
          for name in required:
              if not Path(name).exists():
                  raise SystemExit(f'Missing required file: {name}')

          index = Path('index.html').read_text(encoding='utf-8')
          update = json.loads(Path('update.json').read_text(encoding='utf-8'))
          package = json.loads(Path('package.json').read_text(encoding='utf-8'))

          if '<iframe' in index.lower():
              raise SystemExit('index.html must not use the legacy iframe shell')

          checks = [
              (r'href=["\']\./app\.css(?:\?[^"\']*)?["\']', 'app.css'),
              (r'src=["\']\./app\.js(?:\?[^"\']*)?["\']', 'app.js'),
              (r'src=["\']\./pricing-engine\.js(?:\?[^"\']*)?["\']', 'pricing-engine.js'),
              (r'src=["\']\./smart-buy\.js(?:\?[^"\']*)?["\']', 'smart-buy.js'),
          ]
          for pattern, label in checks:
              if not re.search(pattern, index, re.I):
                  raise SystemExit(f'{label} is not linked from index.html')

          if 'data-page="dashboard"' not in index:
              raise SystemExit('Dashboard navigation is missing')
          if 'show(\'settings\')' not in index:
              raise SystemExit('Settings side-menu entry is missing')
          bottom = index.split('<nav class="bottom">', 1)[1].split('</nav>', 1)[0] if '<nav class="bottom">' in index and '</nav>' in index else ''
          if 'data-page="settings"' in bottom:
              raise SystemExit('Settings must not appear in bottom navigation')
          for page in ('inventory', 'scanner', 'pricing'):
              if f'data-page="{page}"' not in bottom:
                  raise SystemExit(f'Bottom navigation is missing {page}')

          if '10%–40%' not in index and '10%-40%' not in index:
              raise SystemExit('Smart Buy 10%-40% range is not present in the app shell')

          expected_version = str(package.get('version') or '').strip()
          if not expected_version:
              raise SystemExit('package.json version is missing')
          if str(update.get('version') or '').strip() != expected_version:
              raise SystemExit(f"update.json version mismatch: expected {expected_version}, got {update.get('version')}")

          print(f'Standalone Reseller Hub v{expected_version} validation passed.')

      - name: Validate JavaScript syntax
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check pricing-engine.js
          node --check smart-buy.js
          node --check stock-watch.js
          npm run check:release
          echo 'JavaScript syntax and release validation passed.'

      # Version is derived from package.json and cross-checked against update.json.

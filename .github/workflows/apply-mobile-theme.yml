name: Validate Stable App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate standalone app files
        shell: python
        run: |
          from pathlib import Path
          import re
          index=Path('index.html').read_text(encoding='utf-8')
          for f in ['app.css','app.js','pricing-engine.js','update.json','ota.html']:
              if not Path(f).exists():
                  raise SystemExit(f'Missing required file: {f}')
          if 'app.css?v=9.0.0' not in index or 'app.js?v=9.0.0' not in index:
              raise SystemExit('Stable v9 assets are not linked from index.html')
          if '<iframe' in index.lower():
              raise SystemExit('index.html must not use the legacy iframe shell')
          print('Standalone Reseller Hub v9 validation passed.')

name: Apply Mobile App Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared mobile theme is linked
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if not re.search(r'<link\s+rel=["\']stylesheet["\']\s+href=["\']\./mobile-theme\.css(?:\?[^"\']*)?["\']', text, flags=re.I):
              raise SystemExit('mobile-theme.css is not linked from index.html')
          print('Shared mobile theme link verified.')

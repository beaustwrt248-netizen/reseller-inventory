name: Validate Stable App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate standalone app files
        shell: python
        run: |
          from pathlib import Path
          import re
          index=Path('index.html').read_text(encoding='utf-8')
          required=['app.css','app.js','pricing-engine.js','smart-buy.js','sell-first.js','update.json','ota.html']
          for f in required:
              if not Path(f).exists():
                  raise SystemExit(f'Missing required file: {f}')
          for asset in ['app.css','app.js','pricing-engine.js','smart-buy.js','sell-first.js']:
              if not re.search(rf'\./{re.escape(asset)}\?v=', index):
                  raise SystemExit(f'{asset} is not linked from index.html with cache busting')
          if '<iframe' in index.lower():
              raise SystemExit('index.html must not use the legacy iframe shell')
          if "function openMenu()" not in index or 'id="drawer"' not in index:
              raise SystemExit('Retail menu shell is missing')
          if '10% EXCELLENT' not in index or '25% RECOMMENDED' not in index or '40% MAXIMUM' not in index:
              raise SystemExit('Buying guide is incomplete')
          print('Standalone Reseller Hub validation passed.')
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in app.js pricing-engine.js smart-buy.js sell-first.js; do
            node --check "$f"
          done
      - name: Check JavaScript
        shell: python
        run: |
          from pathlib import Path
          js='\n'.join(Path(f).read_text(encoding='utf-8') for f in ['app.js','pricing-engine.js','smart-buy.js','sell-first.js'])
          checks=['function show(', 'startCamera', 'lookupProduct', 'exportBackup', 'BeauSmartBuy', 'Sell-First Intelligence']
          for check in checks:
              if check not in js:
                  raise SystemExit(f'Missing JavaScript feature check: {check}')
          print('JavaScript feature checks passed.')

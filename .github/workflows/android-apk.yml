name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run prepare:web
      - name: Add Android project
        run: npx cap add android
      - name: Apply Android camera permission and WebView handler
        run: node android-camera-fix.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK with app version
        run: cp android/app/build/outputs/apk/debug/app-debug.apk beaus-game-inventory-v1.8.5-debug.apk
      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: beaus-game-inventory-v1.8.5-debug-apk
          path: beaus-game-inventory-v1.8.5-debug.apk

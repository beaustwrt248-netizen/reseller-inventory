name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run prepare:web

      - name: Add Android project
        run: npx cap add android

      - name: Set explicit Android version
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 934', s, count=1)
          s, n2 = re.subn(r'versionName\s+[^\n]+', 'versionName "9.3.4"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not set Android version: versionCode matches={n1}, versionName matches={n2}')
          p.write_text(s)
          print('Android versionCode=934 versionName=9.3.4')
          PY

      - name: Apply Android camera permission and WebView handler
        run: node android-camera-fix.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply custom launcher icon
        shell: bash
        run: |
          set -e
          test -f icon-data/icon.png
          file icon-data/icon.png
          mkdir -p android/app/src/main/res/drawable
          cp icon-data/icon.png android/app/src/main/res/drawable/app_icon.png
          sed -i 's/android:icon="@[^"]*"/android:icon="@drawable\/app_icon"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@[^"]*"/android:roundIcon="@drawable\/app_icon"/' android/app/src/main/AndroidManifest.xml

      - name: Verify custom launcher icon
        shell: bash
        run: |
          set -e
          test -s android/app/src/main/res/drawable/app_icon.png
          file android/app/src/main/res/drawable/app_icon.png | grep -qi "PNG"
          grep -q 'android:icon="@drawable/app_icon"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/app_icon"' android/app/src/main/AndroidManifest.xml

      - name: Verify Android version
        shell: bash
        run: |
          set -e
          grep -q 'versionCode 934' android/app/build.gradle
          grep -q 'versionName "9.3.4"' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK with app version
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk beaus-game-inventory-v9.3.4-debug.apk

      - name: Upload versioned APK
        uses: actions/upload-artifact@v7
        with:
          name: beaus-game-inventory-v9.3.4-debug-apk
          path: beaus-game-inventory-v9.3.4-debug.apk

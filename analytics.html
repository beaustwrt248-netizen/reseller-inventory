<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics</title><link rel="stylesheet" href="./mobile-theme.css"><script src="./nav-safe-area.js"></script><script src="./analytics.js"></script><style>body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;padding-bottom:90px}.wrap{max-width:800px;margin:auto;padding:14px}header{background:#111827;color:white;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 8px #0001}.value{font-size:25px;font-weight:800;margin-top:6px}.label{color:#6b7280;font-size:13px}.mobile-nav{position:fixed;bottom:var(--app-nav-bottom,0);left:0;right:0;height:68px;background:#111827;display:grid;grid-template-columns:repeat(6,1fr);z-index:20;padding:5px}.mobile-nav a{color:#fff;text-decoration:none;text-align:center;font-size:10px;font-weight:bold;padding:7px}.mobile-nav span{display:block;font-size:19px}@media(min-width:701px){.mobile-nav{display:none}}</style></head><body><header><div class="wrap"><h1>📊 Analytics</h1><div>Beau's Game Inventory</div></div></header><main class="wrap"><div class="grid"><div class="card"><div class="label">Inventory items</div><div class="value" id="items">0</div></div><div class="card"><div class="label">Stock cost</div><div class="value" id="cost">$0.00</div></div><div class="card"><div class="label">Stock value</div><div class="value" id="value">$0.00</div></div><div class="card"><div class="label">Sales</div><div class="value" id="sales">0</div></div><div class="card"><div class="label">Sales revenue</div><div class="value" id="revenue">$0.00</div></div><div class="card"><div class="label">Sales profit</div><div class="value" id="profit">$0.00</div></div><div class="card"><div class="label">Estimated total profit</div><div class="value" id="total">$0.00</div></div></div></main><nav class="mobile-nav"><a href="./dashboard.html"><span>📊</span>Dashboard</a><a href="./"><span>📦</span>Inventory</a><a href="./scanner.html"><span>📷</span>Scanner</a><a href="./pricing.html"><span>💰</span>Pricing</a><a href="./sales.html"><span>🧾</span>Sales</a><a href="./settings.html"><span>⚙️</span>Settings</a></nav><script>const a=BeauAnalytics.get(),m=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n);items.textContent=a.inventoryCount;cost.textContent=m(a.stockCost);value.textContent=m(a.stockValue);sales.textContent=a.salesCount;revenue.textContent=m(a.salesRevenue);profit.textContent=m(a.salesProfit);total.textContent=m(a.estimatedTotalProfit);</script></body></html>
